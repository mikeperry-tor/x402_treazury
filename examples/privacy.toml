# README quickstart: copy to privacy.local.toml, initialize a new treasury,
# replace treasury.id, then enable auto_fund after reviewing the spending limits.
version = 1

[network]
mode = "tor"
socks_endpoint = "127.0.0.1:9150"
isolation_namespace = "x402_treazury"
socks_auth = "tor_extended"
connect_timeout_seconds = 120
request_timeout_seconds = 240

[treasury]
id = "11111111-1111-4111-8111-111111111111"
state_dir = "../state/privacy"
key_file = "../secrets/privacy.key"
indexer_url_env = "ZCASH_INDEXER_URL"
submission_url_env = "ZCASH_SUBMISSION_URL"
daily_input_zec = "0.012"
shield_max_fee_zec = "0.0003"

[funding]
auto_fund = false
confidentiality = "public"
# Leave BASE_RPC_URL unset to use the built-in Base RPC failover list.
base_rpc_url_env = "BASE_RPC_URL"

[wallets.research]
mode = "zcash_rotation"
deposit_size = "2.00"
max_price_usd = "0.05"
max_input_zec = "0.006"
max_fee_bps = 500

[sources.botsmith]
extends = "../providers/botsmith.toml"

[sources.exa]
extends = "../providers/exa.toml"

[sources.pdl]
extends = "../providers/pdl.toml"

[sources.googletrends]
extends = "../providers/google-trends.toml"

[sources.genuinegood]
extends = "../providers/genuinegood.toml"

[servers.research]
listen = "127.0.0.1:8000"
bearer_token_env = "TREAZURY_MCP_TOKEN"
wallet = "research"
sources = ["botsmith", "exa", "pdl", "googletrends", "genuinegood"]
include_tools = ["socialfetch_twitter_profiles_handle", "socialfetch_help"]
