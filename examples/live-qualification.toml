# TEMPLATE ONLY. Copy to live-qualification.local.toml and follow tests/live/DRIVER.md.
# No funding starts by default. This demonstrates sharing with one provider;
# the full provider run needs its reviewed sources/cases added before preparation.
version = 1
[network]
mode = "tor"
socks_endpoint = "127.0.0.1:9150"
isolation_namespace = "qualification_replace_me"
socks_auth = "tor_extended"
connect_timeout_seconds = 120
request_timeout_seconds = 240
[treasury]
id = "11111111-1111-4111-8111-111111111111"
state_dir = "../state/qualification-template"
key_file = "../secrets/qualification-template.key"
indexer_url_env = "ZCASH_INDEXER_URL"
submission_url_env = "ZCASH_SUBMISSION_URL"
daily_input_zec = "0.0105"
shield_max_fee_zec = "0.0003"
confirmations = 3
max_sync_age_seconds = 300
[funding]
auto_fund = false
confidentiality = "public"
base_rpc_url_env = "BASE_RPC_URL"
base_confirmations = 12
[wallets.coverage_a]
mode = "zcash_rotation"
# Review the current bridge minimum before authorizing new funding.
# It is not a universal or permanent route minimum.
deposit_size = "1.717124"
max_price_usd = "0.20"
max_input_zec = "0.002"
max_fee_bps = 500
[wallets.coverage_b]
mode = "zcash_rotation"
deposit_size = "1.717124"
max_price_usd = "0.20"
max_input_zec = "0.002"
max_fee_bps = 500
[sources.shared_social]
extends = "../providers/socialfetch.toml"
wallet = "coverage_a"
prefix = "shared"
overrides = {}
probe_pricing = false
[sources.isolated_social]
extends = "../providers/socialfetch.toml"
prefix = "isolated"
overrides = {}
probe_pricing = false
[servers.a]
listen = "127.0.0.1:8381"
bearer_token_env = "QUALIFICATION_A_TOKEN"
wallet = "coverage_a"
sources = ["shared_social"]
include_tools = ["shared_twitter_profiles_handle"]
[servers.b]
listen = "127.0.0.1:8382"
bearer_token_env = "QUALIFICATION_B_TOKEN"
wallet = "coverage_b"
sources = ["shared_social", "isolated_social"]
include_tools = ["shared_twitter_profiles_handle", "isolated_twitter_profiles_handle"]
[servers.c]
listen = "127.0.0.1:8383"
bearer_token_env = "QUALIFICATION_C_TOKEN"
wallet = "coverage_b"
sources = ["isolated_social"]
include_tools = ["isolated_twitter_profiles_handle"]
