# Reserve sizes are funding preferences; the explicit group cap governs every wallet.
# Start with small and optional large reserves; first payment promotes its payer; refill small-first. Retained balances stay usable.
# auto_fund=false pauses new funding, not eligible automatic retirement.
# Size optional large to at least 2x expected maximum payment (prefer 4x); this is not a payment cap.
# Eligible payers use advisory estimates; permitted signatures do not require a target balance.
# Serving binds listeners before funding; explicit bootstrap waits its captured slot jobs.
# First positive USDC credit consumes the initial claim, even below target; accepted source work stays owned.
# Initialize the treasury first; build the server with scripts/zcash.sh.
# This example creates two pools, each starting with one 5 USDC small reserve.
# Serving funds the initial inventories and subsequent replacements under actual spendable treasury capacity and per-operation safeguards.
version = 1

[wallet_assignment]
scope = "source" # deployment | server | source | binding
template = "small"

[wallet_templates.small]
mode = "zcash_rotation"
max_retirement_remainder_usdc = "0" # retire only eligible empty retained wallets
max_api_payment_usdc = "1.00"
max_funding_spend_zec = "0.02"
max_conversion_overhead_percent = 5

[wallet_templates.small.reserves.small]
funding_amount_usdc = "5.00"

[treasury]
state_dir = "../../state/treasury"
max_refund_shielding_fee_zec = "0.001"

[funding]
# Managed serving funds bootstrap and refills by default. Set auto_fund=false to pause new funding.
base_rpc_url_env = "BASE_RPC_URL"
confidentiality = "public" # No NEAR signup; public settlement.

[sources.pdl]
extends = "../../providers/pdl.toml"

[sources.socialfetch]
extends = "../../providers/socialfetch.toml"

[servers.research]
listen = "127.0.0.1:8000"
bearer_token_env = "RESEARCH_MCP_TOKEN"
sources = ["pdl", "socialfetch"]

[servers.social]
listen = "127.0.0.1:8001"
bearer_token_env = "SOCIAL_MCP_TOKEN"
sources = ["socialfetch"]
# In source scope, this listener shares SocialFetch's pool with research.
# To use an explicit exception, define a named profile under [wallets] and
# reference it with wallet = "name" on a source (first priority) or server.
