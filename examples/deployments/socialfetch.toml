version = 1

[sources.socialfetch]
extends = "../../providers/socialfetch.toml"
tags = ["Twitter", "YouTube", "LinkedIn"]
timeout = 90

[wallets.default]
mode = "static"
private_key_env = "EVM_PRIVATE_KEY"
max_api_payment_usdc = "1.00"

[servers.social]
listen = "127.0.0.1:8002"
bearer_token_env = "SOCIAL_MCP_TOKEN"
wallet = "default"
sources = ["socialfetch"]
include_tools = ["socialfetch_*"]
