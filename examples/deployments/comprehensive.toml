# Comprehensive showcase: curated research, shared pools, Tor and agent-added APIs.
# Listener -> sources -> pool:
# web     -> Exa, SocialFetch web/community, Google Trends -> web
# social  -> social platforms, Telegram and people research -> company
# company -> selected company, grants and security research -> company
# toolbox -> endpoint-local agent-added sources -> company
# All pools share one treasury. Paid discovery follows each source's assigned pool.
# See examples/README.md for setup and the smaller managed.toml starter.
# Reserve sizes are funding preferences; the explicit group cap governs every wallet.
# Start with small and optional large reserves; first payment promotes its payer; refill small-first. Retained balances stay usable.
# auto_fund=false pauses new funding, not eligible automatic retirement.
# Size optional large to at least 2x expected maximum payment (prefer 4x); this is not a payment cap.
# Eligible payers use advisory estimates; permitted signatures do not require a target balance.
# Serving binds listeners before funding; explicit bootstrap waits its captured slot jobs.
# First positive USDC credit consumes the initial claim, even below target; accepted source work stays owned.
# Three research contexts and a toolbox share one Zcash treasury and two rotating wallet pools.
# Social, company and toolbox share a payer wallet and Tor identity; web stays separate.
# Copy this file to comprehensive.local.toml before editing.
# Existing state/privacy and state/privacy-sources.sqlite identities are retained.
# Run each agent against the MCP listener for its research context.
# Separate wallets/circuits do not hide identifying terms in API request content.
version = 1

# Tor Browser SOCKS endpoint; keep Tor Browser running while serving.
# Catalog/help identities are discovery-scoped; paid calls follow wallets.
[network]
mode = "tor"
socks_endpoint = "127.0.0.1:9150"
isolation_namespace = "x402_treazury"
socks_auth = "tor_extended"
connect_timeout_seconds = 120
read_timeout_seconds = 60

# Paid fallback for blocked catalog GETs, using each source's assigned
# wallet. Shared sources choose one assigned profile deterministically; config
# show reports discovery_wallets. Paid API calls retain their listener bindings.
[relay_fallback]
source_discovery = true # directory search and service metadata
api_requests = false # opt in to disclose actual API requests
provider_metadata = true # schemas/help, startup and explicit non-direct warming
# wallet = "web" # optional override: share this wallet for all discovery

# Select by original target method; absent/empty lists mean origin-only.
[relay_fallback.relays]
GET = ["../../providers/curl/provider.toml", "../../providers/agproxy.toml"]
POST = ["../../providers/agproxy.toml"]
HEAD = ["../../providers/agproxy.toml"]

# Treasury commands use this same state directory and its default wallet.key.
[treasury]
state_dir = "../../state/privacy"
# Standard network fees are calculated by the wallet; these reject high-fee proposals.
# max_funding_transaction_fee_zec = "0.0003" # default per funding transaction
# max_refund_shielding_fee_zec = "0.0003"     # default per refund shielding transaction

[funding]
# Managed serving funds bootstrap and refills by default. Set auto_fund=false to pause new funding.
confidentiality = "public"
# Leave BASE_RPC_URL unset to use the built-in Base RPC failover list.
base_rpc_url_env = "BASE_RPC_URL"

# Each pool starts with one small reserve and no separate active wallet.
# Two groups with $2 small reserves request $4 before fees and accepted bridge minimum increases.
# Allow additional treasury funds for those costs and replacements after the first payment.
# Actual deposits may rise with swap minimums. All declared pools initialize, even
# unused ones: remove unused wallet definitions and update bindings to save funding.
# max_api_payment_usdc caps one payment, not the total research budget.
[wallets.web]
mode = "zcash_rotation"
max_retirement_remainder_usdc = "0" # retire only eligible empty retained wallets
max_api_payment_usdc = "0.10"
max_funding_spend_zec = "0.006" # optional per-transfer ZEC cap, including network fee
max_conversion_overhead_percent = 5

[wallets.web.reserves.small]
funding_amount_usdc = "2.00"
max_funding_amount_usdc = "3.00" # explicit headroom for bridge minimums

# Social, company and toolbox share this pool, reserve and Tor payer identities.
# The shared $0.50 per-payment cap covers the selected RelayShield tools.
# Social and toolbox calls use this same cap; larger batches may still exceed it.
[wallets.company]
mode = "zcash_rotation"
max_retirement_remainder_usdc = "0" # retire only eligible empty retained wallets
max_api_payment_usdc = "0.50"
max_funding_spend_zec = "0.006" # optional per-transfer ZEC cap, including network fee
max_conversion_overhead_percent = 5

[wallets.company.reserves.small]
funding_amount_usdc = "2.00"
max_funding_amount_usdc = "3.00" # explicit headroom for bridge minimums

# Source instructions_text is agent-facing guidance. Each MCP server listener
# combines instructions from sources with selected tools into the MCP server's
# instructions for the agent, labeled with [source_id], and appends a
# pricing caveat. An endpoint instructions_text replaces this composed guidance.
# Endpoints below use brief initialization guidance; keep operation requirements
# in provider tool descriptions and social capability keywords in search help.
# Source-local instructions_text replaces inherited provider guidance; tool
# descriptions are configured separately through source overrides.

# SocialFetch appears in two contexts with overlapping Reddit coverage,
# demonstrating that even the same provider/tool can use different payers.
# Using different wallets keeps the social queries to SocialFetch unlinked and
# isolated from the webinfo queries.

[sources.social]
extends = "../../providers/socialfetch.toml"
tags = ["Bluesky", "Facebook", "GitHub", "Hacker News", "Instagram", "LinkedIn", "Reddit", "Rumble", "Snapchat", "Telegram", "Threads", "TikTok", "Truth Social", "Twitter", "Twitch", "Yelp", "YouTube"]
exclude_tools = ["socialfetch_help"]

[sources.webinfo]
extends = "../../providers/socialfetch.toml"
tags = ["Web", "Reddit"]
exclude_tools = ["socialfetch_help"]

# Exa supplies the web listener. Its supported payable island includes help;
# subset providers below omit broad vendor guides.
[sources.exa]
extends = "../../providers/exa.toml"

# Person lookups stay in the social context. Vendor-listed matches cost $0.28,
# within the shared $0.50 cap for one matched result; use small batches.
[sources.pdl_people]
extends = "../../providers/pdl.toml"
include_tools = ["pdl_person_*"]

# Structured company discovery complements Deepline enrichment.
# The PDL catalog lists $0.10 per company result; prefer small batches under
# the shared $0.50 per-payment cap.
[sources.pdl_company]
extends = "../../providers/pdl.toml"
include_tools = ["pdl_company_search"]

# StableEnrich purpose selections narrow the supported catalog and omit broad
# help. Each source inherits its listener's wallet.
# Social estimates are $0.01-$0.05 per call. FullEnrich ($0.15), StableEnrich
# PDL ($0.28), Whitepages ($0.22) and Lens ($0.20) remain outside this subset.
[sources.social_stableenrich]
extends = "../../providers/stableenrich.toml"
include_tools = [
  "stableenrich_reddit_search",
  "stableenrich_reddit_post_comments",
  "stableenrich_minerva_resolve",
  "stableenrich_minerva_enrich",
  "stableenrich_minerva_validate_emails",
  "stableenrich_serper_people_image_search",
]

# Company estimates are $0.0126-$0.08 per call, within the $0.50 cap.
# FullEnrich company search ($0.15) is omitted. Keep person/contact enrichment
# on the social listener.
[sources.company_stableenrich]
extends = "../../providers/stableenrich.toml"
include_tools = [
  "stableenrich_companyenrich_org_enrich",
  "stableenrich_companyenrich_properties_enrich",
  "stableenrich_google_maps_text_search_partial",
  "stableenrich_google_maps_text_search_full",
  "stableenrich_google_maps_nearby_search_partial",
  "stableenrich_google_maps_nearby_search_full",
  "stableenrich_google_maps_place_details_partial",
  "stableenrich_google_maps_place_details_full",
  "stableenrich_serper_news",
  "stableenrich_firecrawl_scrape",
]

# Tool-name allowlists keep the company toolset small as upstream catalogs grow.
# Broad vendor help tools are omitted to avoid suggesting unselected operations.
# Cheap, focused public-company financial statements and news.
[sources.company_otto]
extends = "../../providers/otto.toml"
include_tools = ["otto_financial_statements", "otto_equity_news"]

# Startup/crypto/investor research: RootData profiles crypto projects and venture
# organizations, including teams, backers and funding rounds. Search resolves IDs
# for project/org lookups; this is company intelligence, not trading execution.
[sources.company_claw402]
extends = "../../providers/claw402.toml"
# Select the RootData research routes from the full supported catalog.
include_tools = [
  "claw402_crypto_rootdata_search",
  "claw402_crypto_rootdata_project",
  "claw402_crypto_rootdata_org",
  "claw402_crypto_rootdata_funding",
]

# Business profiles and competitor advertising; no personal contact harvesting.
[sources.company_deepline]
extends = "../../providers/deepline.toml"
tags = ["Company", "Ads"]
include_tools = ["deepline_company_enrich", "deepline_ads_search"]

# Public-company discovery, overview, SEC disclosures and filing summaries.
# Retain inherited exclusions; omit trading signals, expensive research memos
# and vendor-wide help. Saved prices for these four calls are $0.01-$0.05.
[sources.company_x402stock]
extends = "../../providers/x402stock.toml"
include_tools = [
  "x402stock_tickers",
  "x402stock_overview_ticker",
  "x402stock_dossier_ticker",
  "x402stock_filing_summary_ticker",
]

# Multi-board job search (LinkedIn, Indeed, Glassdoor, Google Jobs, ZipRecruiter,
# Bayt, BDJobs, Naukri). Base price is $0.05 + $0.002 * len(sites) * maxResults,
# so len(sites) * maxResults <= 25 keeps an individual query at $0.10 or less
# under the shared $0.50 cap; prefer small batches even with that headroom.
# (hirescrape_linkedin's job-search modes from llms.txt are absent from its OpenAPI schema.)
[sources.company_hirescrape]
extends = "../../providers/hirescrape.toml"
include_tools = ["hirescrape_jobs"]

# European and global business registries, German Handelsregister, one-call due
# diligence ($0.10), EU VIES VAT validation, sanctions screening and domain intel.
[sources.company_agosint]
extends = "../../providers/agosint.toml"
include_tools = [
  "agosint_company",
  "agosint_company_de",
  "agosint_due_diligence",
  "agosint_vat",
  "agosint_sanctions",
  "agosint_domain",
]

# Company security research: eleven explicitly selected main-catalog tools plus
# the local phone companion. Both inherit the existing company wallet; no new pool.
[sources.company_relayshield]
extends = "../../providers/relayshield.toml"
include_tools = [
  "relayshield_breach",
  "relayshield_sim_swap",
  "relayshield_infostealer",
  "relayshield_identity_graph",
  "relayshield_supply_chain",
  "relayshield_ip_intel",
  "relayshield_ransomware_risk",
  "relayshield_secret_scan",
  "relayshield_identity_risk_score",
  "relayshield_tech_stack_cve",
  "relayshield_wallet_risk",
]

[sources.company_relayshield_phone]
extends = "../../providers/relayshield/phone-reputation.toml"
include_tools = ["relayshield_phone_reputation"]

# Focused NetIntel phone, IP and company-infrastructure intelligence.
# Inherit the company wallet and its $0.50 per-payment cap.
[sources.company_netintel]
extends = "../../providers/netintel.toml"
include_tools = [
  "netintel_phone_intel_analyze",
  "netintel_ip_reputation_analyze",
  "netintel_ip_report_full",
  "netintel_ip_geo_locate",
  "netintel_whois_rdap_lookup",
  "netintel_cloud_fingerprint_analyze",
  "netintel_tech_fingerprint_analyze",
]

# IP enrichment and satellite observations for company infrastructure/site research.
# Inherit the existing company wallet and its $0.50 per-payment cap.
[sources.company_ipintel]
extends = "../../providers/ipintel.toml"
include_tools = ["ipintel_ip_lookup", "ipintel_satellite"]

# Company profiles, public records, market signals and specialist research through Vaaya.
# Inherit the existing company wallet and its $0.50 per-payment cap.
[sources.company_vaaya]
extends = "../../providers/vaaya.toml"
include_tools = [
  "vaaya_fundable_company_search",
  "vaaya_fundable_company",
  "vaaya_courtlistener_cases",
  "vaaya_courtlistener_dockets",
  "vaaya_akta_headcount_trends",
  "vaaya_akta_product_reviews",
  "vaaya_theirstack_technographics",
  "vaaya_theirstack_tech_catalog",
  "vaaya_signalbase_funding",
  "vaaya_signalbase_acquisitions",
  "vaaya_edgar_entities",
  "vaaya_edgar_fulltext",
  "vaaya_edgar_filings",
  "vaaya_edgar_document",
  "vaaya_edgar_concept",
  "vaaya_edgar_index",
  "vaaya_uspto_assignees",
  "vaaya_uspto_patents",
  "vaaya_wayback_snapshots",
  "vaaya_wayback_available",
  "vaaya_wayback_fetch",
  "vaaya_tako_search",
  "vaaya_tako_answer",
  "vaaya_tako_contents",
  "vaaya_recallradar_search",
  "vaaya_recallradar_get",
]

[sources.googletrends]
extends = "../../providers/google-trends.toml"

# GenuineGood is a grant discovery service. Keep its selected search and detail
# tools for focused company grant research.
[sources.genuinegood]
extends = "../../providers/genuinegood.toml"
include_tools = ["genuinegood_search", "genuinegood_detail"]

# MCP endpoints expose separate toolsets; social, company and toolbox share payment identity.
# Sources inherit each listener wallet unless a source explicitly overrides it.
[servers.web]
instructions_text = "Web research and aggregate keyword trends. Preserve source links, dates and coverage; trends do not describe an individual’s behavior."
# discover_on_demand = true # advertise search/call wrappers; fetch schemas as needed
listen = "127.0.0.1:6337"
bearer_token_env = "X402_TREAZURY_MCP_TOKEN"
wallet = "web"
sources = ["exa", "webinfo", "googletrends"]

[servers.social]
# Keep platform coverage in search help, including for clients that omit server instructions.
discover_on_demand = true
instructions_text = "Social and people research."
discovery_search_tool_instructions_text = """
Social tool keywords to search for:
- SocialFetch: `Bluesky`, `Facebook`, `GitHub`, `Hacker News`, `Instagram`,
  `LinkedIn`, `Reddit`, `Rumble`, `Snapchat`, `Telegram`,
  `Threads`, `TikTok`, `truthsocial` (Truth Social), `Twitter` (X), `Twitch`,
  `Yelp`, `YouTube`.
- People Data Labs: `pdl_person` (person enrichment and search).
- StableEnrich: `stableenrich_reddit` (Reddit searches and comments),
  `stableenrich_minerva` (person resolution, enrichment, and email checks),
  `stableenrich_serper_people_image_search` (people images).
"""
listen = "127.0.0.1:6338"
bearer_token_env = "X402_TREAZURY_MCP_TOKEN"
wallet = "company"
sources = ["social", "pdl_people", "social_stableenrich"]

[servers.company]
instructions_text = "Company and public-record research. Verify entity identity; preserve source links, dates and partial results. Missing findings do not prove absence."
listen = "127.0.0.1:6339"
bearer_token_env = "X402_TREAZURY_MCP_TOKEN"
wallet = "company"
sources = ["genuinegood", "pdl_company", "company_otto", "company_claw402", "company_deepline", "company_x402stock", "company_stableenrich", "company_hirescrape", "company_agosint", "company_relayshield", "company_relayshield_phone", "company_netintel", "company_ipintel", "company_vaaya"]

# Start with discovery tools; persist agent-added APIs separately from the treasury.
[servers.toolbox]
instructions_text = "" # Discovery wrappers carry the provider-management workflow.
listen = "127.0.0.1:6340"
bearer_token_env = "X402_TREAZURY_MCP_TOKEN"
wallet = "company"
provider_management_local = true
provider_management_remote = true
# coinbase_curated is the curated-only alternative; coinbase includes both scopes.
remote_provider_directories = ["coinbase", "x402-list"]
raw_url_calls = true
source_registry_file = "../../state/privacy-sources.sqlite" # Toolbox-local registrations.
sources = []
