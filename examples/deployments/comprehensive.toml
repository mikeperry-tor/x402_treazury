[sources.googletrends]
extends = "../../providers/google-trends.toml"

# GenuineGood is a grant discovery service. Keep its selected search and detail
# tools for focused company grant research.
[sources.genuinegood]
extends = "../../providers/genuinegood.toml"
include_tools = ["genuinegood_search", "genuinegood_detail"]

# MCP endpoints expose separate toolsets. All initially share web; after company's
# first credit, social/company/toolbox share company's payment identity.
# Sources inherit each listener wallet unless a source explicitly overrides it.
[servers.web]
instructions_text = "Web research and aggregate keyword trends. Preserve source links, dates and coverage; trends do not describe an individual’s behavior."
# discover_on_demand = true # advertise search/call wrappers; fetch schemas as needed
listen = "127.0.0.1:6337"
bearer_token_env = "X402_TREAZURY_MCP_TOKEN"
wallet = "web"
sources = ["exa", "googletrends"]

[servers.social]
# Keep platform coverage in search help, including for clients that omit server instructions.
discover_on_demand = true
instructions_text = "Social and people research."
discovery_search_tool_instructions_text = """
Social tool keywords to search for:
- Botsmith and Otto: social posts, profiles, timelines, watchlists, sentiment and
  curated summaries.
- Glim and 2s: X/Twitter trends, GitHub repository/code search, Reddit search and
  reads, and Hacker News stories, comments and users.
- ShopSocial and AgData: Instagram, TikTok, YouTube, Facebook, Threads, Pinterest
  and Telegram profiles, transcripts and comments.
- People Data Labs, StableEnrich and Deepline: person enrichment, email validation,
  employer/title data and contact lookup.
- CompanyRecords and AgData: LinkedIn company profiles.
"""
listen = "127.0.0.1:6338"
bearer_token_env = "X402_TREAZURY_MCP_TOKEN"
wallet = "company"
sources = ["pdl_people", "social_stableenrich"]

[servers.company]
instructions_text = "Company and public-record research. Verify entity identity; preserve source links, dates and partial results. Compare SEC fact periods explicitly: latest quarterly flows differ from fiscal-year-to-date and annual totals; Horizon supplies US-GAAP facts, not IFRS. Missing findings do not prove absence."
listen = "127.0.0.1:6339"
bearer_token_env = "X402_TREAZURY_MCP_TOKEN"
wallet = "company"
sources = ["genuinegood", "pdl_company", "company_otto", "company_horizonpulse", "company_claw402", "company_deepline", "company_x402stock", "company_stableenrich", "company_hirescrape", "company_agosint", "company_relayshield", "company_relayshield_phone", "company_netintel", "company_ipintel", "company_vaaya"]

# Start with discovery tools; persist agent-added APIs separately from the treasury.
[servers.toolbox]
instructions_text = "" # Discovery wrappers carry the provider-management workflow.
listen = "127.0.0.1:6340"
bearer_token_env = "X402_TREAZURY_MCP_TOKEN"
wallet = "company"
provider_management_local = true
provider_management_remote = true
# coinbase_curated is the curated-only alternative; coinbase includes both scopes.
remote_provider_directories = ["coinbase", "x402-list"]
raw_url_calls = true
source_registry_file = "../../state/privacy-sources.sqlite" # Toolbox-local registrations.
sources = []
