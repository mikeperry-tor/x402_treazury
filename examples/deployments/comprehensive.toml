# IP enrichment and satellite observations for company infrastructure/site research.
# Inherit company: web's $0.10 cap before first credit, company's $0.50 afterward.
[sources.company_ipintel]
extends = "../../providers/ipintel.toml"
include_tools = ["ipintel_ip_lookup", "ipintel_satellite"]

# Company profiles, public records, market signals and specialist research through Vaaya.
# Inherit company: web's $0.10 cap before first credit, company's $0.50 afterward.
[sources.company_vaaya]
