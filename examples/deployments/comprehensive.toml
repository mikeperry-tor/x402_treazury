# Comprehensive showcase: curated research, shared pools, Tor and agent-added APIs.
# Listener -> sources -> intended group (company initially uses web):
# web     -> Exa, Google Trends and shared social search -> web
# social  -> social platforms, Telegram and people research -> company
# company -> selected company, grants and security research -> company
# toolbox -> endpoint-local agent-added sources -> company
# All groups share one treasury. Implicit paid discovery follows effective routing.
# See examples/README.md for setup and the smaller managed.toml starter.
# Reserve sizes are funding preferences; the effective payer group supplies the payment cap.
# Start with small and optional large reserves; first payment promotes its payer; refill small-first. Retained balances stay usable.
# auto_fund=false pauses new funding, not eligible automatic retirement.
# Size optional large to at least 2x expected maximum payment (prefer 4x); this is not a payment cap.
# Eligible payers use advisory estimates; permitted signatures do not require a target balance.
# Serving binds listeners before funding; wallet bootstrap prepares only web's enabled reserves.
# First positive USDC credit consumes the initial claim, even below its nominal minimum; accepted source work stays owned.
# Three research contexts and a toolbox share one Zcash treasury and two rotating wallet pools.
# All contexts initially share web's payer and $0.10 cap. After company's first credit,
# social/company/toolbox share company's payer and $0.50 cap, separately from web.
# Copy this file to comprehensive.local.toml before editing.
# Existing state/privacy and state/privacy-sources.sqlite identities are retained.
# Run each agent against the MCP listener for its research context.
# Separate wallets/circuits do not hide identifying terms in API request content.
version = 1

# Fund web first. The first valid company/social/toolbox API call records demand;
# company prepares later at randomized 30-120-second opportunities, without making
# calls wait for swaps. Cap refusals still record demand. Even tiny first credit
# permanently hands later calls to company; depletion never returns them to web.
# A company group credited in an earlier run uses its own payer immediately.
# Comment out this entire table to fund both groups normally and avoid payer sharing
# from the beginning. Existing funds and historical links are not moved or erased.
[wallet_bootstrap]
bootstrap_group = "web"
deferred_groups = ["company"]

# Tor Browser SOCKS endpoint; keep Tor Browser running while serving.
# Catalog/help identities are discovery-scoped; paid calls follow wallets.
[network]
mode = "tor"
socks_endpoint = "127.0.0.1:9150"
isolation_namespace = "x402_treazury"
socks_auth = "tor_extended"
connect_timeout_seconds = 120
read_timeout_seconds = 60

# Paid fallback for blocked catalog reads. Bootstrap policy keeps metadata and
# directory relay fees on web, overriding relay_fallback.wallet without activating
# company funding. config show reports discovery_wallets. Without bootstrap policy,
# an explicit wallet selects the static discovery payer; otherwise shared sources
# choose an intended group deterministically. Relay permissions remain separate.
[relay_fallback]
source_discovery = true # directory search and service metadata
api_requests = false # opt in to disclose actual API requests
provider_metadata = true # schemas/help, startup and explicit non-direct warming
# wallet = "web" # static discovery override when bootstrap policy is absent

# Select by original target method; absent/empty lists mean origin-only.
[relay_fallback.relays]
GET = ["../../providers/readfetch.toml", "../../providers/agproxy.toml"]
POST = ["../../providers/readfetch.toml", "../../providers/agproxy.toml"]
HEAD = ["../../providers/readfetch.toml", "../../providers/agproxy.toml"]

# Treasury commands use this same state directory and its default wallet.key.
[treasury]
state_dir = "../../state/privacy"
# Standard network fees are calculated by the wallet.

[funding]
# Managed serving funds bootstrap and refills by default. Set auto_fund=false to pause new funding.
confidentiality = "public"
# Leave BASE_RPC_URL unset to use the built-in Base RPC failover list.
base_rpc_url_env = "BASE_RPC_URL"

# Initial setup: web's one default $2-3 small allocation; allow the $3 upper bound
# plus source fees and bridge costs. Eventual configured initial inventory across
# both groups is $4-6 nominal (also the initial range with this policy disabled).
# Keep extra capital for company preparation, relay payments and replacements.
# One group's first wallet plus its later replacement average about $5 nominal
# across two $2-3 allocations ($4-6 before bridge floors/fees), not $5 at startup.
# The first payment makes a READY payer ACTIVE and opens its replacement vacancy.
# max_api_payment_usdc caps one payment, not the total research budget.
[wallets.web]
mode = "zcash_rotation"
max_retirement_remainder_usdc = "0.001" # default per-group retirement tolerance
max_api_payment_usdc = "0.10"

[wallets.web.reserves.small]
# Default randomized nominal funding: $2-3.

# Social, company and toolbox share this intended group after its first credit.
# Until then, web's $0.10 cap can refuse some selected calls; activation still stands.
# Company's later $0.50 cap covers selected RelayShield tools, but large batches
# can exceed it. Captured calls finish under their original payer and cap.
[wallets.company]
mode = "zcash_rotation"
max_retirement_remainder_usdc = "0.001" # default per-group retirement tolerance
max_api_payment_usdc = "0.50"

[wallets.company.reserves.small]
# Default randomized nominal funding: $2-3.

# Source instructions_text is agent-facing guidance. Each MCP server listener
# combines instructions from sources with selected tools into the MCP server's
# instructions for the agent, labeled with [source_id], and appends a
# pricing caveat. An endpoint instructions_text replaces this composed guidance.
# Endpoints below use brief initialization guidance; keep operation requirements
# in provider tool descriptions and social capability keywords in search help.
# Source-local instructions_text replaces inherited provider guidance; tool
# descriptions are configured separately through source overrides.

# Social sources mirror the research desk selections after SocialFetch was
# removed for reliability and an oversized OpenAPI document. Multiple providers
# share the social payer, so first-use activation demonstrates that the same
# platform families can move from web to company without a provider identity.
# Delayed funding cannot erase earlier links and is not an unlinkability guarantee.

[sources.social_botsmith]
# Catalogs and price hints persist indefinitely; use positive seconds to expire,
# or 0 to disable disk caching. Explicit catalog warm always re-downloads.
catalog_cache_ttl_seconds = "indefinite"
extends = "../../providers/botsmith.toml"
send_tools = [
  { to = "exclude", tools = ["help", "jev", "polymarket_*"] },
  { to = "exclude", tools = [
    "x_search", "x_tweet", "x_user", "x_mentions", "x_timeline",
    "x_thread", "x_trends", "x_users_search",
  ] },
  { to = "social" },
]

[sources.social_glim]
extends = "../../providers/glim.toml"
send_tools = [
  { to = "exclude", tools = ["twitter_get", "web_search", "web_fetch", "telegram_*", "youtube_*"] },
  { to = "exclude", tools = ["twitter_tweets_search"] },
  { to = ["web", "social"], tools = ["twitter_trends"] },
  { to = "social", tools = ["twitter_*", "github_*", "reddit_*"] },
  { to = "exclude" },
]

[sources.social_twos]
extends = "../../providers/2s.toml"
send_tools = [
  { to = "social", tools = ["news_hn_search", "news_hn_item", "news_hn_top", "news_hn_user"] },
  { to = "exclude" },
]

[sources.social_apexfaucet]
extends = "../../providers/apexfaucet.toml"
send_tools = [
  { to = "social", tools = ["research_search"] },
  { to = "exclude" },
]

[sources.social_agdata]
extends = "../../providers/agdata.toml"
send_tools = [
  { to = ["company", "social"], tools = ["linkedin_company"] },
  { to = "social", tools = ["instagram", "tiktok", "youtube", "facebook_page"] },
  { to = "exclude" },
]

[sources.social_shopsocial]
extends = "../../providers/shopsocial.toml"
send_tools = [
  { to = "social", tools = [
    "social_instagram_profile", "social_tiktok_profile", "social_youtube",
    "social_facebook_pages", "social_youtube_transcript", "social_youtube_comments",
    "social_threads_profile", "social_pinterest", "social_telegram_channel",
  ] },
  { to = "exclude" },
]

[sources.social_companyrecords]
extends = "../../providers/companyrecords.toml"
send_tools = [
  { to = ["company", "social"], tools = ["b2b_linkedin_company_profiles"] },
  { to = "exclude" },
]

[sources.social_deepline]
extends = "../../providers/deepline.toml"
send_tools = [
  { to = "social", tools = ["email_*", "phone_find"] },
  { to = "exclude" },
]

[sources.social_otto]
extends = "../../providers/otto.toml"
send_tools = [
  { to = "social", tools = ["kol_sentiment", "twitter_summary"] },
  { to = "exclude" },
]

# Exa supplies the web listener. Its supported payable island includes help;
# subset providers below omit broad vendor guides.
[sources.exa]
extends = "../../providers/exa.toml"

# Person lookups stay in the social context. Vendor-listed matches cost $0.28,
# within company's $0.50 cap after first credit, above the initial $0.10 cap.
[sources.pdl_people]
extends = "../../providers/pdl.toml"
include_tools = ["pdl_person_*"]

# Structured company discovery complements Deepline enrichment.
# The PDL catalog lists $0.10 per company result; prefer small batches under
# company's $0.50 cap after first credit; web's $0.10 cap applies before then.
[sources.pdl_company]
extends = "../../providers/pdl.toml"
include_tools = ["pdl_company_search"]

# StableEnrich purpose selections narrow the supported catalog and omit broad
# help. Each source inherits its listener's wallet.
# Social estimates are $0.01-$0.28 per call. FullEnrich ($0.15) and Whitepages
# ($0.22) can exceed web's initial $0.10 cap but remain within company's $0.50 cap
# after first credit; permitted signatures do not require an estimate match.
# StableEnrich PDL ($0.28) and Lens ($0.20) remain outside this subset.
[sources.social_stableenrich]
extends = "../../providers/stableenrich.toml"
include_tools = [
  "stableenrich_reddit_search",
  "stableenrich_reddit_post_comments",
  "stableenrich_minerva_resolve",
  "stableenrich_minerva_enrich",
  "stableenrich_minerva_validate_emails",
  "stableenrich_serper_people_image_search",
  "stableenrich_fullenrich_people_search",
  "stableenrich_whitepages_person_search",
]

# Company estimates are $0.0126-$0.08 per call, within both effective caps.
# FullEnrich company search ($0.15) is omitted. Keep person/contact enrichment
# on the social listener.
[sources.company_stableenrich]
extends = "../../providers/stableenrich.toml"
include_tools = [
  "stableenrich_companyenrich_org_enrich",
  "stableenrich_companyenrich_properties_enrich",
  "stableenrich_google_maps_text_search_partial",
  "stableenrich_google_maps_text_search_full",
  "stableenrich_google_maps_nearby_search_partial",
  "stableenrich_google_maps_nearby_search_full",
  "stableenrich_google_maps_place_details_partial",
  "stableenrich_google_maps_place_details_full",
  "stableenrich_serper_news",
  "stableenrich_firecrawl_scrape",
]

# Tool-name allowlists keep the company toolset small as upstream catalogs grow.
# Broad vendor help tools are omitted to avoid suggesting unselected operations.
# Cheap, focused public-company financial statements and news.
[sources.company_otto]
extends = "../../providers/otto.toml"
include_tools = ["otto_financial_statements", "otto_equity_news"]

# Latest SEC US-GAAP facts complement Otto statements and filing summaries.
# Compare actual periods: quarterly flows are not fiscal-year-to-date totals.
# The pinned local catalog avoids another remote catalog download.
[sources.company_horizonpulse]
extends = "../../providers/horizonpulse.toml"
include_tools = ["horizonpulse_sec_company_facts"]

# Startup/crypto/investor research: RootData profiles crypto projects and venture
# organizations, including teams, backers and funding rounds. Search resolves IDs
# for project/org lookups; this is company intelligence, not trading execution.
[sources.company_claw402]
extends = "../../providers/claw402.toml"
# Select the RootData research routes from the full supported catalog.
include_tools = [
  "claw402_crypto_rootdata_search",
  "claw402_crypto_rootdata_project",
  "claw402_crypto_rootdata_org",
  "claw402_crypto_rootdata_funding",
]

# Business profiles and competitor advertising; no personal contact harvesting.
[sources.company_deepline]
extends = "../../providers/deepline.toml"
tags = ["Company", "Ads"]
include_tools = ["deepline_company_enrich", "deepline_ads_search"]

# Public-company discovery, overview, SEC disclosures and filing summaries.
# Retain inherited exclusions; omit trading signals, expensive research memos
# and vendor-wide help. Saved prices for these four calls are $0.01-$0.05.
[sources.company_x402stock]
extends = "../../providers/x402stock.toml"
include_tools = [
  "x402stock_tickers",
  "x402stock_overview_ticker",
  "x402stock_dossier_ticker",
  "x402stock_filing_summary_ticker",
]

# Multi-board job search (LinkedIn, Indeed, Glassdoor, Google Jobs, ZipRecruiter,
# Bayt, BDJobs, Naukri). Base price is $0.05 + $0.002 * len(sites) * maxResults,
# so len(sites) * maxResults <= 25 keeps an individual query at $0.10 or less
# under company's later $0.50 cap; initially web's $0.10 cap applies.
# (hirescrape_linkedin's job-search modes from llms.txt are absent from its OpenAPI schema.)
[sources.company_hirescrape]
extends = "../../providers/hirescrape.toml"
include_tools = ["hirescrape_jobs"]

# European and global business registries, German Handelsregister, one-call due
# diligence ($0.10), EU VIES VAT validation, sanctions screening and domain intel.
[sources.company_agosint]
extends = "../../providers/agosint.toml"
include_tools = [
  "agosint_company",
  "agosint_company_de",
  "agosint_due_diligence",
  "agosint_vat",
  "agosint_sanctions",
  "agosint_domain",
]

