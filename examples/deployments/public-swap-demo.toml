# Reserve sizes are funding preferences; the explicit group cap governs every wallet.
# Start with small and optional large reserves; first payment promotes its payer; refill small-first. Retained balances stay usable.
# auto_fund=false pauses new funding, not eligible automatic retirement.
# First positive USDC credit consumes the initial claim, even below target; accepted source work stays owned.
# One pool, one listener, one cheap tool. Follow ../../docs/public-swap-demo.md.
# Copy beside this file as public-swap-demo.local.toml before editing.
version = 1

[treasury]
state_dir = "../../state/public-demo"
# wallet.key lives inside state_dir; the treasury ID is read from existing state.
# Zcash endpoints use the built-in default unless explicitly overridden.
max_refund_shielding_fee_zec = "0.0003"
confirmations = 3

[funding]
auto_fund = false # Change only after explicitly approving the funded test.
confidentiality = "public"
base_rpc_url_env = "BASE_RPC_URL"
base_confirmations = 12
slippage_bps = 100
poll_seconds = 5 # Local scheduling/jitter; recurring network observations retain a 60-second floor.
swap_timeout_seconds = 1800
quote_deadline_seconds = 1800

[wallets.demo]
mode = "zcash_rotation"
max_retirement_remainder_usdc = "0" # retire only eligible empty retained wallets
max_api_payment_usdc = "0.05"
max_funding_spend_zec = "0.006"
max_conversion_overhead_percent = 5
max_attempts = 3

[wallets.demo.reserves.small]
funding_amount_usdc = "5.00"

[sources.socialfetch]
extends = "../../providers/socialfetch.toml"
# Scoped request capture includes this demo's selected Twitter profile contract.
# It is not the complete SocialFetch inventory; inspection fetches no vendor data.
spec = "../../tests/fixtures/socialfetch_openapi.json"
probe_pricing = false

[servers.demo]
listen = "127.0.0.1:8000"
bearer_token_env = "PUBLIC_DEMO_MCP_TOKEN"
wallet = "demo"
sources = ["socialfetch"]
include_tools = ["socialfetch_twitter_profiles_handle"]
