# One pool, one listener, one cheap tool. Follow ../../docs/public-swap-demo.md.
# Copy beside this file as public-swap-demo.local.toml before editing.
version = 1

[treasury]
state_dir = "../../state/public-demo"
# wallet.key lives inside state_dir; the treasury ID is read from existing state.
# Zcash endpoints use the built-in default unless explicitly overridden.
daily_treasury_spend_limit_zec = "0.012"
max_refund_shielding_fee_zec = "0.0003"
confirmations = 3
max_sync_age_seconds = 300

[funding]
# Gross USDC allocated across bootstrap and replacements; not API spending.
daily_funding_limit_usdc = "10.00"
total_funding_limit_usdc = "10.00"
auto_fund = false # Change only after explicitly approving the funded test.
confidentiality = "public"
base_rpc_url_env = "BASE_RPC_URL"
base_confirmations = 12
base_max_block_age_seconds = 120
slippage_bps = 100
poll_seconds = 5
swap_timeout_seconds = 1800
quote_deadline_seconds = 1800

[wallets.demo]
mode = "zcash_rotation"
funding_amount_usdc = "5.00"
max_api_payment_usdc = "0.05"
max_funding_spend_zec = "0.006"
max_conversion_overhead_percent = 5
max_attempts = 3

[sources.socialfetch]
extends = "../../providers/socialfetch.toml"
# Committed request schema: inspection requires no vendor fetch or pricing probes.
spec = "../../tests/fixtures/socialfetch_openapi.json"
probe_pricing = false

[servers.demo]
listen = "127.0.0.1:8000"
bearer_token_env = "PUBLIC_DEMO_MCP_TOKEN"
wallet = "demo"
sources = ["socialfetch"]
include_tools = ["socialfetch_twitter_profiles_handle"]
