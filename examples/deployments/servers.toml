# Paths resolve relative to the file declaring them.
version = 1

# Provider definitions control startup pricing discovery; set probe_pricing = false
# on a source to disable it. Results and failures are shared for the process lifetime.
[sources.pdl]
extends = "../../providers/pdl.toml"
timeout = 30
# wallet = "default" # Optional source override, shared across listeners using pdl.

[sources.lonestar]
extends = "../../providers/lonestar.toml"
timeout = 90

[wallets.default]
mode = "static"
private_key_env = "EVM_PRIVATE_KEY"
max_api_payment_usdc = "1.00"

[servers.research]
listen = "127.0.0.1:8000"
bearer_token_env = "RESEARCH_MCP_TOKEN"
wallet = "default"
sources = ["pdl", "lonestar"]
include_tools = ["pdl_*", "lonestar_*"]
exclude_tools = ["pdl_person_search"]

[servers.companies]
listen = "127.0.0.1:8001"
bearer_token_env = "COMPANIES_MCP_TOKEN"
wallet = "default"
sources = ["pdl"]
include_tools = ["pdl_company_*"]
