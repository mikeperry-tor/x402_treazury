# Minimal managed deployment: Exa + agent-added APIs -> research listener -> research pool.
# Copy beside this file as managed.local.toml before editing.
# Initialize the treasury with wallet init --config YOUR_LOCAL_CONFIG, then send
# ZEC to its shielded receive address. Keep the listener token in the environment.
# Serving binds the listener before background funding; bootstrap is optional.
version = 1

[treasury]
state_dir = "../../state/managed"

[funding]
confidentiality = "public" # Public NEAR settlement; no NEAR signup required.

[wallets.research]
mode = "zcash_rotation"
max_api_payment_usdc = "0.50" # Per authorization, independently of reserve size.

[wallets.research.reserves.small]
# Default randomized nominal funding: $2-5.

[sources.exa]
extends = "../../providers/exa.toml" # Web search, page contents and on-demand help.
instructions_text = "Use exa_search for URL discovery and exa_contents for known URLs. Consider type=lite ($0.004) for lower-cost indexed search when its restricted inputs and lack of live fetching fit the task; auto ($0.007) remains the general-search default. Use deeper modes when the task needs them. Content options add charges; choose freshness, coverage and quality before price."

[servers.research]
listen = "127.0.0.1:8000"
bearer_token_env = "X402_TREAZURY_MCP_TOKEN"
wallet = "research"
sources = ["exa"]
provider_management_local = true
provider_management_remote = true
# coinbase_curated is the curated-only alternative; coinbase includes both scopes.
remote_provider_directories = ["coinbase", "x402-list"]
raw_url_calls = true
# Registrations last until exit; optionally persist them:
# source_registry_file = "../../state/managed-sources.sqlite"
