# --- Listeners ---------------------------------------------------------------

[servers.web]
listen = "127.0.0.1:3010"
allowed_hosts = ["host.docker.internal", "127.0.0.1"]
bearer_token_env = "X402_TREAZURY_MCP_TOKEN"
wallet = "web"
instructions_text = "Web search, page retrieval and scraping, news and coverage timelines, academic papers and researcher profiles, structured page extraction, blocked-page retrieval, web archives and historical snapshots, keyword trends, image search, reverse-image search and shopping. Use this endpoint for source discovery and web content; use social or business for profiles. Academic sources include OpenAlex and Valyu; news timelines use GDELT. Bright Data and Diffbot support blocked-page retrieval and typed extraction; Firecrawl and Serper offer comparison sources; Wayback supplies archived pages and snapshot discovery."

[servers.social]
listen = "127.0.0.1:3011"
allowed_hosts = ["host.docker.internal", "127.0.0.1"]
bearer_token_env = "X402_TREAZURY_MCP_TOKEN"
wallet = "social"
discover_on_demand = true
instructions_text = "Social-platform, person, public-profile and business-contact research, including email lookup and validation. Search by platform or person. Preserve platform, date and partial-result markers; missing posts do not prove absence."
discovery_search_tool_instructions_text = "Social keywords: reddit, github, bluesky, facebook, hackernews, instagram, linkedin, tiktok, trend charts, popular creators, popular songs, popular videos, popular hashtags, HireScrape, twitter, x, youtube, telegram, person, profile, headshot, enrichment, employer, title, seniority, location, phone, mobile phone, address, work email, email validation, deliverability, catch-all, Deepline, ZeroBounce, Minerva, FullEnrich, Whitepages, Tomba, LinkedIn email, contact phone, company phone, Threads, Pinterest, Snapchat, Twitch, Rumble, Truth Social, SoundCloud, Spotify, Apple Music, Linktree, Yelp, Amazon Shop, Google Ad Transparency, LinkedIn jobs and organizations."

