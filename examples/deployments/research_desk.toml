# Research APIs grouped into task-oriented MCP endpoints.
#
# Endpoint   Scope                                             Wallet
# web        Search, retrieval, news and archives              web
# science    Academic, scientific and health research           web
# social     People, contacts and platform content             social
# business   Organizations, filings, jobs, funding, reviews     financials
# finance    Equities, macro, crypto and derivatives            financials
# property   Parcels, local records, zoning and site context    financials
# security   Threats, breaches and infrastructure checks        financials
# world      Geopolitics, weather, shipping, regional conditions global
# toolbox    Dynamic provider management and raw calls          global
# travel     Destination references, ski resorts and conditions global
#
# Wallets share payer identities within each topical group. Separate groups
# reduce payer reuse across topics; they do not guarantee unlinkability.
# Payment caps apply to each challenge, including dynamically priced requests;
# selected tools can offer request sizes or services above these caps.
#
# Copy to research_desk.local.toml before editing. Ensure Tor is running
# at the configured SOCKS endpoint and X402_TREAZURY_MCP_TOKEN is available.

version = 1

[network]
mode = "tor"
socks_endpoint = "127.0.0.1:9150"
isolation_namespace = "x402_treazury"
socks_auth = "tor_extended"
connect_timeout_seconds = 120
request_timeout_seconds = 240

# Paid fallback for blocked catalog/help GETs. Paid API calls retain their
# listener bindings.
[relay_fallback]
source_discovery = true
api_requests = false
provider_metadata = true

[relay_fallback.relays]
GET = ["../../providers/curl/provider.toml", "../../providers/agproxy.toml"]
POST = ["../../providers/agproxy.toml"]
HEAD = ["../../providers/agproxy.toml"]

[treasury]
state_dir = "../../state/research_desk"
indexer_url = "https://na.zec.rocks:443"

[funding]
confidentiality = "public"
base_rpc_url_env = "BASE_RPC_URL"

# Web search, content retrieval and science share this payer pool.
[wallets.web]
mode = "zcash_rotation"
max_api_payment_usdc = "0.50"
max_conversion_overhead_percent = 5

[wallets.web.reserves.small]
funding_amount_usdc = "2.00"
max_funding_amount_usdc = "3.00"

# People, contacts and social-platform research share this payer pool.
[wallets.social]
mode = "zcash_rotation"
max_api_payment_usdc = "0.50"
max_conversion_overhead_percent = 5

[wallets.social.reserves.small]
funding_amount_usdc = "2.00"
max_funding_amount_usdc = "3.00"

# Business, finance, property and security research share this payer pool.
# Arkham lookups and x402stock research can exceed $0.50.
[wallets.financials]
mode = "zcash_rotation"
max_api_payment_usdc = "1.00"
max_conversion_overhead_percent = 5

[wallets.financials.reserves.small]
funding_amount_usdc = "2.00"
max_funding_amount_usdc = "3.00"

# World, travel and dynamic toolbox calls share this payer pool.
# LoneStar CrownBlock region/report calls advertise $1.00 pricing.
[wallets.global]
mode = "zcash_rotation"
max_api_payment_usdc = "1.00"
max_conversion_overhead_percent = 5

[wallets.global.reserves.small]
funding_amount_usdc = "2.00"
max_funding_amount_usdc = "3.00"

# Each source owns its ordered exclusions and endpoint assignments. The first
# matching send_tools rule consumes a tool; destination arrays preserve explicit sharing.
# Each final catch-all assigns unmatched tools to a primary endpoint or excludes them.
#
# Coverage and price comparisons are noted beside the affected selections.
# We favor information quality before price, then ease of use when prices are close.
#
# --- Sources -----------------------------------------------------------------
# One source per provider. Ordered send_tools rules assign generated tool families to endpoints.
# A provider shared across categories is still downloaded only once.

[sources.exa]
extends = "../../providers/exa.toml"
send_tools = [
  # Inline schemas cover selected calls; vendor help adds HTTP/payment setup.
  { to = "exclude", tools = ["help"] },
  { to = "web" },
]

[sources.google_trends]
extends = "../../providers/google-trends.toml"
send_tools = [
  # trend_over_time covers every supported window and reports granularity.
  # Inline guidance replaces vendor help with unselected bridge follow-ups.
  { to = "exclude", tools = ["trend", "help"] },
  { to = "web" },
]

# Disabled after failed paid settlement/lookup probes on 2026-10-28.
# 402radar's latest listed Base payment was 3 days old at review:
# https://402radar.io/api.socialfetch.dev
# Activity is an external observation, not proof of settlement or universal outage.
[sources.socialfetch]
extends = "../../providers/socialfetch.toml"
send_tools = [{ to = "exclude" }]

[sources.pdl]
extends = "../../providers/pdl.toml"
send_tools = [
  # Route business research families before the primary fallback.
  { to = "business", tools = ["company_*"] },
  { to = "social" },
]

[sources.arkham]
extends = "../../providers/arkham.toml"
send_tools = [
  { to = "finance" },
]

# filing_search and financials_ticker provide distinct filing-search and statement coverage.
[sources.x402stock]
extends = "../../providers/x402stock.toml"
send_tools = [
  { to = "science", tools = ["clinical_trials", "fda", "fda_shortages"] },
  # Route business research families before the primary fallback.
  { to = "business", tools = [
    "beneficial_ownership_ticker",
    "concept_ticker",
    "congress_trades",
    "dossier_ticker",
    "filing_*",
    "financials_ticker",
    "form_144",
    "form_144_ticker",
    "fund_*",
    "gov_*",
    "overview_ticker",
    "patent_*",
    "patents",
    "private_stocks",
    "regulatory",
    "research_ticker",
    "score_factors_ticker",
    "tickers",
  ] },
  # Share guidance or research across the relevant endpoints.
  { to = ["business", "finance"], tools = ["company_facts_ticker", "private_stocks_symbol"] },
  { to = "finance" },
]

# x_user and x_watchlist provide account and watchlist research.
[sources.botsmith]
extends = "../../providers/botsmith.toml"
send_tools = [
  # Keep probabilistic model questions outside this research deployment; inline schemas replace help.
  { to = "exclude", tools = ["help", "jev"] },
  # Share source-level X search with web alongside Otto topical synthesis.
  # First-page posts/metrics are qualified; returned-cursor pagination is not.
  { to = ["web", "social"], tools = ["x_search"] },
  # Route financial research families before the primary fallback.
  { to = "finance", tools = ["polymarket_*"] },
  { to = "social" },
]

# Asset digests, sentiment, OHLC, signals, stablecoins and trade preflight
# complement market research. alerts_asset supplies BTC and other asset alerts.
[sources.kronos]
extends = "../../providers/kronos.toml"
send_tools = [
  { to = "exclude", tools = ["alerts_btc"] }, # Superseded by alerts_asset with asset="btc": matching alerts/state at the same $0.02.
  { to = "finance" },
]

[sources.regimeshift]
extends = "../../providers/regimeshift.toml"
send_tools = [
  { to = "finance" },
]

# Retain complementary financial, corporate, property and regional research;
# omit superseded tools, duplicate previews and model/document workflows below.
[sources.lonestar]
extends = "../../providers/lonestar.toml"
send_tools = [
  { to = "exclude", tools = [
    "read_read", # Otto web_extract and StableEnrich Firecrawl supply rendered page reads.
    "sanctions_screen", # Superseded by AgOSINT sanctions: dated OFAC/EU/UK evidence versus OFAC only; $0.015 versus $0.05.
    "funding_extremes", # Same-price subset of funding_rates; ranks the same asset/venue rates.
    "funding_signal", # Same-price signal already included in funding_rates.
    "liq_biggest", # Same-price subset of liq_liquidations, which includes each asset's biggest liquidation.
    "liq_signal", # Same-price signal already included in liq_liquidations.
    "stable_risk_summary", # Same-price summary already included in stable_pulse; sampled payloads matched.
  ] },
  { to = "exclude", tools = [               # These are expensive LLM calls/doc handling
    "content_repurpose",
    "doc_*",
    "floyd_*",
    "copperhead_*",
    "cottonmouth_*",
    "rattler_*"
  ] },
  # Omit duplicate signal/preview/demo variants and provider feedback; retain the selected full research tools.
  { to = "exclude", tools = [
    "agri_feed",
    "agri_preview",
    "capitol_signal",
    "content_preview",
    "feedback",
    "gap_*",
    "help",
    "latam_feed",
    "lease_auctions",
    "lease_expiring",
    "lease_portfolio",
    "lease_preview",
    "oi_extremes",
    "oi_signal",
    "read_demo",
    "realestate_feed",
    "realestate_preview",
    "stake_preview",
    "ta_preview",
    "ta_scan",
    "token_demo",
  ] },
  # Route business research families before the primary fallback.
  { to = "business", tools = [
    "bundle_*",
    "earnings_calendar",
    "funds_funds",
    "insider_trades",
    "pharma_catalysts",
  ] },
  # Route security research families before the primary fallback.
  { to = "security", tools = ["contract_verify", "kya_*"] },
  # Route world research families before the primary fallback.
  { to = "world", tools = [
    "africa_pulse",
    "agri_report",
    "asia_pulse",
    "capitol_trades",
    "conflict_conflict",
    "consumer_consumer",
    "crownblock_*",
    "energy_energy",
    "europe_pulse",
    "geo_risk",
    "govedge_*",
    "grid_*",
    "hazard_hazard",
    "labor_labor",
    "latam_report",
    "lease_report", # Offshore Gulf oil/gas lease-sale and block data.
    "mena_pulse",
    "minerals_minerals",
    "news_news",
    "sovereign_sovereign",
    "spark_power",
    "supply_report",
    "weather_forecast", # Date-specific ensemble probabilities for ten US cities; complements Otto's global current/5-day weather.
  ] },
  # Unmatched tools include realestate_report: national housing/mortgage macro data.
  { to = "finance" },
]

# Retain distinct equity, macro, on-chain, curated social and weather research.
# Omit generative and model workflows, aggregate mega reports and video generation.
[sources.otto]
extends = "../../providers/otto.toml"
send_tools = [
  # Direct Exa returned more primary sources in both sampled searches and exposes filters/content controls.
  { to = "exclude", tools = ["web_search"] }, # Superseded by Exa search; $0.007 sampled versus $0.009 for this Exa wrapper.
  # AgOSINT covers domain enrichment; NetIntel supplies DNS and RDAP dates.
  { to = "exclude", tools = ["domain_report"] },
  # Keep complementary crypto briefings alongside Exa's source-level news search.
  { to = "web", tools = ["filtered_news", "news_recaps"] },
  # These fresh domain reads matched the alternatives and retain distinct fields.
  { to = "security", tools = ["dns_lookup", "whois_lookup", "domain_age"] },
  { to = "exclude", tools = ["tweet_search"] }, # Botsmith supplies matching posts and metrics.
  { to = "exclude", tools = [        # Expensive low-value LLM calls
    "generate_meme",
    "llm_research",
    "mega_report",
    "meta_intelligence",
    "tx_explainer",
    "video_gen",
  ] },
  # Keep provider feedback/refund workflows outside endpoint research; inline schemas replace help.
  { to = "exclude", tools = ["feedback", "help"] },
  # Route business research families before the primary fallback.
  { to = "business", tools = [
    "13d_activist_watch",
    "8k_material_events",
    "analyst_ratings",
    "earnings_calendar",
    "equity_*",
    "financial_statements",
    "form_*",
    "insider_trades",
    "institutional_holdings",
  ] },
  # Route social research families before the primary fallback.
  { to = "social", tools = ["kol_sentiment", "twitter_summary"] },
  # Route web research families before the primary fallback.
  # Keep rendered reading, cited answers and browser-dependent JSON/links.
  # Static alternatives below do not qualify all JS-generated fields/links; check
  # Otto freshness/degradation and destination rather than trusting HTTP success.
  { to = "web", tools = ["web_*"] },
  # Route world research families before the primary fallback.
  { to = "world", tools = ["weather"] },
  { to = "finance" },
]

# company_brief provides distinct company-brief coverage.
[sources.concordance]
extends = "../../providers/concordance/provider.toml"
send_tools = [
  # Root/health add no research; inline schemas replace vendor HTTP help.
  { to = "exclude", tools = ["healthz", "root", "help"] },
  { to = ["business", "finance"], tools = ["catalog"] },
  # Route business research families before the primary fallback.
  { to = "business", tools = ["company_brief"] },
  # Route financial research families before the primary fallback.
  { to = "finance", tools = ["series"] },
  { to = "web" },
]

# Macro, EDGAR, on-chain and deterministic text utilities provide complementary coverage.
[sources.agentfund]
extends = "../../providers/agentfund.toml"
send_tools = [
  # Superseded by x402stock filing_search: sampled matches preserve forms, filing URLs and reporting periods.
  { to = "exclude", tools = ["edgar_full_text_search"] },
  # Route business research families before the primary fallback.
  { to = "business", tools = ["edgar_*", "structured_json_repair", "tabular_to_json"] },
  { to = "finance" },
]

# Retain flags, risk premiums and compact observations; brief/export/history_feed
# duplicate available feeds.
[sources.straits]
extends = "../../providers/straits/provider.toml"
send_tools = [
  { to = "exclude", tools = [
    "brief",
    "export",
    "history_feed",
  ] },
  { to = "world" },
]

# Retain full research tools; omit samples, health checks and the free-tool index.
[sources.brazilayer]
extends = "../../providers/brazilayer.toml"
send_tools = [
  { to = "exclude", tools = [  # Demo/free endpoints excluded
    "*_amostra",
    "ferramenta*",
    "health",
  ] },
  # Inline schemas replace the tool guide.
  { to = "exclude", tools = ["help"] },
  # Route business research families before the primary fallback.
  { to = "business", tools = [
    "bcb_instituicao_cnpj",
    "cnpj_*",
    "empresa_enriquecer_cnpj",
    "licitacoes_*",
    "tributos_*",
  ] },
  # Route security research families before the primary fallback.
  { to = "security", tools = ["integridade_consulta_cnpj"] },
  # Route world research families before the primary fallback.
  { to = "world", tools = ["cadeias_*", "commodities_*", "desmatamento_*"] },
  { to = "finance" },
]

# Use canonical POST tools for same-path GET/POST twins. Preflight exceeds
# the financials per-payment cap.
[sources.genuinegood]
extends = "../../providers/genuinegood.toml"
send_tools = [
  { to = "exclude", tools = ["preflight"] },
  { to = "business" },
]

# Search/image tools are routed to web; people, business and property searches
# are routed below. Keep help available for each selected subset.
[sources.stableenrich]
extends = "../../providers/stableenrich.toml"
send_tools = [
  # Preserve the qualified cited-answer tool before excluding other Exa wrappers.
  { to = "web", tools = ["exa_answer"] },
  { to = "exclude", tools = [
    "exa_*",               # Use exa directly instead
    "firecrawl_search",    # Direct Exa supplies web discovery; Firecrawl scrape remains enabled.
    "serper_news",         # Upstream credit failure; use Exa's news category and date filters.
    "pdl_people_enrich",   # Use PDL directly instead
    # Prefer solar_building_insights for directly usable structured results.
    # These imagery layers require extra asset retrieval and processing or viewing.
    "google_maps_solar_data_layers",
    "google_maps_solar_rgb_image",
  ] },
  # Match site-specific tools before general Google business-location tools.
  { to = "property", tools = ["google_maps_solar_*", "whitepages_property_search"] },
  # Route business research families before the primary fallback.
  { to = "business", tools = [
    "companyenrich_*",
    "fullenrich_company_search",
    "google_*",
  ] },
  # Share guidance or research across the relevant endpoints.
  { to = ["business", "property", "social", "web"], tools = ["help"] },
  # Route social research families before the primary fallback.
  { to = "social", tools = [
    "fullenrich_people_search",
    "minerva_*",
    "reddit_*",
    "serper_people_image_search",
    "whitepages_person_search",
  ] },
  { to = "web" },
]

# Qualified static-page JSON/links, without enabling the full utility catalog.
# These fetch HTML rather than rendering JS. The browser-render alternative failed
# qualification; Otto's distinct browser-dependent tools remain available above.
[sources.agentutility]
extends = "../../providers/agentutility/provider.toml"
send_tools = [
  { to = "web", tools = ["scrape_to_json", "link_extract", "archive_snapshot"] },
  { to = "exclude" },
]

# Qualified repository metadata; other GitHub operations remain separate candidates.
[sources.agent402]
extends = "../../providers/agent402.toml"
send_tools = [
  { to = "social", tools = ["github_repo"] },
  { to = "exclude" },
]

# Keyword search plus original patent claims; 2s supplies a second search service.
[sources.google_patents]
extends = "../../providers/google-patents.toml"
send_tools = [
  { to = "business", tools = ["search", "patent"] },
  { to = "exclude" },
]

# Market families and project trend feeds are available on the finance endpoint.
# Entity, funding and ecosystem/category research is available on business.
[sources.claw402]
extends = "../../providers/claw402.toml"
# Comparison guidance from one live sample; retain complementary coverage.
# For funding rates, prefer otto_funding_rates for compact per-symbol funding/OI summaries.
# Other CoinAnk tools retain broader exchange and market coverage.
# NOFX adds ranking screens; Vergex adds detailed order-flow rankings.
# kronos_funding_arb_asset adds normalized, fee-adjusted funding spreads;
# x402stock_perps_coin provides detailed Hyperliquid market state.
send_tools = [
  { to = "exclude", tools = [
    # Prefer otto_funding_rates for compact per-symbol summaries. The sampled
    # CoinAnk response was ~1.3 MB and contained stale/conflicting funding fields.
    "coinank_funding_rate_current",
    "ai_*",                       # Model workflows are outside this research deployment.
    # Incremental synchronization is omitted; use fresh search/profile calls for ad hoc research.
    "crypto_rootdata_changes",
    "crypto_rootdata_credits",     # Provider credit diagnostic, not research data.
    "crypto_rootdata_id_map",      # Search supplies IDs for targeted lookups; omit the bulk map.
    "crypto_rootdata_twitter_map", # Use project/org/people for individual entities; omit bulk X export.
  ] },
  # Route business research families before the primary fallback.
  { to = "business", tools = [
    "crypto_rootdata_ecosystem_map",
    "crypto_rootdata_funding",
    "crypto_rootdata_investors",
    "crypto_rootdata_job_changes",
    "crypto_rootdata_org",
    "crypto_rootdata_people",
    "crypto_rootdata_project",
    "crypto_rootdata_projects_*",
    "crypto_rootdata_search",
    "crypto_rootdata_tag_map",
  ] },
  # Share guidance or research across the relevant endpoints.
  { to = ["business", "finance"], tools = ["help"] },
  { to = "finance" },
]

# Company research and decision-maker discovery are available on business.
# Targeted email and mobile-phone lookups are available on social.
[sources.deepline]
extends = "../../providers/deepline.toml"
# Retain targeted business-contact tools; keep general identity enrichment with Minerva/PDL.
send_tools = [
  { to = "exclude", tools = [
    "company_enrich", # Superseded by PDL company_enrich: richer funding and firmographics at similar price in both sampled companies.
    "email_personal",
    "linkedin_find",
    "person_from_email",
  ] },
  # Route social research families before the primary fallback.
  { to = "social", tools = ["email_*", "phone_find"] },
  { to = "business" },
]

# Job-board research is available on business.
# Small synchronous social probes failed with an expired upstream token.
[sources.hirescrape]
extends = "../../providers/hirescrape.toml"
send_tools = [
  { to = "exclude", tools = [
    "help",
    # Instagram, LinkedIn, TikTok and YouTube returned HTTP 401 "Token expired"
    # even for one-record synchronous modes; TikTok reported settlement before failure.
    # Other modes can also hand off to unsupported SIWX snapshot retrieval.
    "instagram",
    "linkedin",
    "tiktok",
    "tiktok_shop",
    "youtube",
  ] },
  # Route business research families before the primary fallback.
  { to = "business", tools = ["jobs"] },
  # An Indeed-only one-record jobs request completed inline; other boards remain unqualified.
  { to = "exclude" },
]

# Network ownership and routing checks are available on security.
[sources.agosint]
extends = "../../providers/agosint.toml"
send_tools = [
  { to = "exclude", tools = [
    "endpoints", # MCP discovery already exposes the available tool inventory.
    "help", # Inline tool guidance covers lookups without manual payment instructions.
  ] },
  # Route security research families before the primary fallback.
  { to = "security", tools = ["domain", "network", "sanctions"] },
  { to = "business" },
]

[sources.relayshield]
extends = "../../providers/relayshield.toml"
send_tools = [
  { to = "exclude", tools = [
    "intent_*", # External payment bindings/attestations; outside our research workflow.
    "scamkit_*", # Specialist fingerprinting/matching; deliberately omitted for focus.
    # URL scan lacks VirusTotal result polling; EVM wallet scan overlaps broader wallet_risk at twice the price.
    "scan_*",
    "v1_*", # Keep public checks and passport/TAP workflows excluded by operator choice.
    "bulk_identity_risk", # $2 exceeds the $1.00 financials payment cap; use targeted checks.
    "campaign_scan", # $5.50 exceeds the cap; use targeted checks instead of campaign aggregation.
    "cert_expiry", # Narrow CT-based expiry check; AgOSINT domain already includes TLS details.
    "help", # Inline schemas cover selected tools; guide includes metered/account workflows.
    # Keep llm_credential_exposure: explicit AI-provider API-key coverage is not promised by nhi_exposure.
    "nft_security", # Specialist NFT screening deliberately omitted for focus.
    "phone_reputation", # Same tool name is supplied by the phone companion source below.
    "prompt_injection_breach", # Account exposure overlaps session_risk/infostealer; not prompt-content analysis.
    "secret_scan_text", # Paid upload of text/diffs for pattern matching; prefer local secret scanning.
    "target_risk", # Same six signal families as identity_risk_score, at $0.50 versus $0.35.
    "token_security", # Finance offers Otto GoPlus screening at $0.001 versus $0.05; no proven added coverage.
    "wallet_screen_batch", # $0.50 equals ten wallet_risk calls; singles cost less for smaller sets.
  ] },
  { to = "security" },
]

[sources.relayshield_phone]
extends = "../../providers/relayshield/phone-reputation.toml"
send_tools = [
  { to = "security" },
]

[sources.netintel]
extends = "../../providers/netintel.toml"
send_tools = [
  { to = "exclude", tools = [
    # Model gateways and text processing: outside the selected infrastructure research scope.
    "api_*",
    "extract_*",
    "openai_*",
    "schema_*",
    "text_*",
    "translate_*",
    "v1_*",
    # Financial and weather tools are covered by the dedicated endpoints/providers.
    "crypto_*",
    "currency_*",
    "prediction_*",
    "wallet_*",
    "weather_*",
    # Domain bundles/acquisition/watch tools add overlapping summaries or separate monitoring workflows.
    # DNS and RDAP stay enabled; AgOSINT supplies domain/company enrichment.
    "domain_*",
    "ip_geo_locate", # Prefer IPIntel's $0.003 enrichment with PTR and proxy/mobile/hosting flags over $0.002 geo alone.
    "asn_lookup_analyze", # IPIntel covers basic ASN; AgOSINT adds prefixes/RPKI for $0.015 versus $0.03 here.
    "ssl_cert", # Prefer richer ssl_analyze ($0.007); AgOSINT domain also includes basic TLS facts.
    "url_safety_full", # $0.15 bundle overlaps enabled targeted URL, TLS and header checks.
    "ip_risk_score", # Overlaps retained full IP report; narrower IPIntel/reputation/blacklist checks also available.
    # Email bundles overlap the retained DNS SPF/DMARC fields and social's validation tools.
    "email_*",
    # General web/search tools are outside this security selection. Otto and Firecrawl render pages.
    "event_*",
    "exa_*",
    "web_*",
    "calendar_ics",
    "og_scraper_extract",
    "page_extract_read",
    "pdf_parse",
    "robots_txt_analyze",
    "rss_parser_fetch",
    "sitemap_parser_fetch",
    "wayback_lookup",
    # Remote model/compute helpers are redundant with agent or local tooling.
    "ai_image_generate",
    "classify",
    "content_moderate",
    "convert",
    "cron_parser_explain",
    "embeddings",
    "entity_extract",
    "iban_validate",
    "json_repair",
    "jwt_inspector_decode",
    "lang_detect_analyze",
    "markdown_clean",
    "messages",
    "money_parse",
    "normalize_json",
    "semantic_rank",
    "sentiment_analyze",
    "subnet_calc",
