# Copy beside this file as agent-sources-managed.local.toml to customize.
# Build with scripts/zcash.sh and initialize the treasury before serving.
# One pool targets $5 active + $5 standby, regardless of registered API count.
version = 1

[wallets.agent_shared]
mode = "zcash_rotation"
funding_amount_usdc = "5.00"
max_api_payment_usdc = "0.05"
max_funding_spend_zec = "0.006"
max_conversion_overhead_percent = 5

[treasury]
state_dir = "../../state/agent-treasury"
daily_treasury_spend_limit_zec = "0.012"
max_refund_shielding_fee_zec = "0.0003"

[funding]
# Gross USDC allocated across bootstrap and replacements; not API spending.
daily_funding_limit_usdc = "20.00"
total_funding_limit_usdc = "50.00"
# Managed serving funds bootstrap and refills by default. Set auto_fund=false to pause new funding.
confidentiality = "public"
base_rpc_url_env = "BASE_RPC_URL"

[source_management]
wallet = "agent_shared"
# Omit registry_file to keep agent-added sources only until exit.
registry_file = "../../state/agent-sources.sqlite"
# Optional exact HTTPS origin allowlist covers imported spec URLs AND added API destinations.
# allowed_origins = ["https://api.example.com"]

[servers.research]
source_management = true
listen = "127.0.0.1:8000"
bearer_token_env = "RESEARCH_MCP_TOKEN"

[servers.analysis]
source_management = true
listen = "127.0.0.1:8001"
bearer_token_env = "ANALYSIS_MCP_TOKEN"
