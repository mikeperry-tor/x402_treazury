# Copy beside this file as agent-sources-managed.local.toml to customize.
# Build with scripts/zcash.sh and initialize the treasury before serving.
# One pool targets $5 active + $5 standby, regardless of registered API count.
version = 1

[wallets.agent_shared]
mode = "zcash_rotation"
deposit_size = "5.00"
max_price_usd = "0.05"
max_input_zec = "0.006"
max_fee_bps = 500

[treasury]
state_dir = "../../state/agent-treasury"
daily_input_zec = "0.012"
shield_max_fee_zec = "0.0003"

[funding]
# Managed serving funds bootstrap and refills by default. Set auto_fund=false to pause new funding.
confidentiality = "public"
base_rpc_url_env = "BASE_RPC_URL"

[source_management]
wallet = "agent_shared"
registry_file = "../../state/agent-sources.sqlite"
max_sources = 16
max_tools_per_source = 100
max_tools_per_server = 200
max_spec_bytes = 33554432
fetch_timeout_seconds = 30
# Optional exact HTTPS origin allowlist covers spec URLs AND API destinations.
# allowed_origins = ["https://api.example.com"]

[sources.directory]
extends = "../../providers/x402-list.toml"
# Offline startup snapshot; the actual directory tool calls use its live API.
spec = "../../tests/fixtures/x402_list_openapi.json"
wallet = "agent_shared"

[servers.research]
listen = "127.0.0.1:8000"
bearer_token_env = "RESEARCH_MCP_TOKEN"
sources = ["directory"]

[servers.research.source_management]
enabled = true
accept_sources = true
allowed_targets = ["research", "analysis"]
allow_process_scope = true
allow_persistence = true
max_owned_sources = 8

[servers.analysis]
listen = "127.0.0.1:8001"
bearer_token_env = "ANALYSIS_MCP_TOKEN"
sources = []

[servers.analysis.source_management]
accept_sources = true
# Receives sources and can search/call them; cannot add, update or remove them.
# wallet = "another_named_profile" # Optional explicit server/group isolation.
