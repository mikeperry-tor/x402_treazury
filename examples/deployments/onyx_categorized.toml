  "ipintel_help", # Inline schemas cover the selected IP and satellite tools.
  "ipintel_http_latency", # Cloudflare-edge HTTP timing, not caller latency; lower-priority diagnostic.
  "ipintel_json_schema_validator", # Prefer local validation over paid remote computation.
  "ipintel_jwt_decode", # Prefer local decoding; remote decoding exposes token contents and does not verify signatures.
  "ipintel_reverse_dns", # PTR is already included in ipintel_ip_lookup.
  "ipintel_whois_lookup", # Otto supplies core registration fields for $0.001 versus $0.005; redaction/server fields are lower priority.
]

