# Categorized consolidation of the Onyx vendor lineup and the comprehensive
# research sources into task-oriented MCP endpoints.
#
# Endpoints:
#   web        -> search, retrieve, trends, citations          -> web wallet
#   social     -> people, platforms, Telegram/X                -> research wallet
#   company    -> entities, registries, filings, jobs, grants   -> financials wallet
#   markets    -> equities, macro, commodities                  -> financials wallet
#   crypto     -> on-chain, DeFi, prediction markets            -> financials wallet
#   security   -> threat, breach, network, compliance           -> research wallet
#   world      -> geopolitics, shipping, energy, physical data  -> financials wallet
#   toolbox    -> dynamic provider management and raw calls     -> research wallet
#
# Wallet mapping requested for this consolidation:
#   web         = web
#   research    = social, security, toolbox
#   financials  = company, markets, crypto, world
#
# The treasury key and funded financials pool were copied from onyx_multiport
# into a separate state directory. The two deployments are now independent;
# later state changes in one do not appear in the other.
#
# Disabled Onyx tools are excluded per provider except where a disabled tool
# supplies a capability absent from every enabled tool. Those exceptions are
# noted beside the source that re-enables them. Unprefixed Onyx names (the old
# Backup Fetch Tools server) are mapped to the generated socialfetch_* names.
#
# Copy to onyx_categorized.local.toml before editing. Ensure Tor is running at
# the configured SOCKS endpoint and TREAZURY_MCP_TOKEN is available.
#
# TODO:
# Different endpoint categories could help, in two distinct ways:
#
# - **Add property/local:** a better home for Locus, Whitepages property, Solar and related real-estate/local-government tools. This improves agent understanding. Moving Locus alone wouldn’t shorten routing lists, because it currently belongs only to company.
# - **Merge markets and crypto into finance:** this would materially reduce routing across Otto, LoneStar, x402stock and others. Both already use the same wallet profile. The tradeoff is a broader endpoint, although discovery on demand avoids advertising its entire tool catalog upfront.
# - **Split people/contact research from social content:** potentially clearer, but it creates more boundaries inside LinkedIn and other providers, so it may increase routing work.
#
# A plausible eight-endpoint arrangement would be:
#
# | Endpoint | Scope |
# |---|---|
# | web | Search, retrieval, archives, academic research |
# | social | People, contacts and platform content |
# | business | Organizations, filings, jobs, funding, reviews |
# | finance | Equities, macro, crypto and derivatives |
# | property | Parcels, local records, zoning, environmental/site context |
# | security | Threats, breaches and infrastructure checks |
# | world | Geopolitics, weather, shipping and regional conditions |
# | toolbox | Dynamic provider management and raw calls |

version = 1

[network]
mode = "tor"
socks_endpoint = "127.0.0.1:9150"
isolation_namespace = "x402_treazury"
socks_auth = "tor_extended"
connect_timeout_seconds = 120
request_timeout_seconds = 240

# Paid fallback for blocked catalog/help GETs. Paid API calls retain their
# listener bindings.
[relay_fallback]
source_discovery = true
api_requests = false
provider_metadata = true

[relay_fallback.relays]
GET = ["../../providers/curl/provider.toml", "../../providers/agproxy.toml"]
POST = ["../../providers/agproxy.toml"]
HEAD = ["../../providers/agproxy.toml"]

[treasury]
state_dir = "../../state/onyx_categorized"
indexer_url = "https://na.zec.rocks:443"

[funding]
confidentiality = "public"
base_rpc_url_env = "BASE_RPC_URL"

# financials inherits the funded active+standby pair copied from onyx_multiport.
# web and research were repaired to empty reserve claims and will be funded by
# managed serving according to their targets and caps.
#
# Web queries are cheap and are kept on a separate payer identity.
[wallets.web]
mode = "zcash_rotation"
max_api_payment_usdc = "0.25"
max_conversion_overhead_percent = 5

[wallets.web.reserves.small]
funding_amount_usdc = "2.00"
max_funding_amount_usdc = "3.00"

# Social, security and the dynamic toolbox share a research payer.
[wallets.research]
mode = "zcash_rotation"
max_api_payment_usdc = "0.50"
max_conversion_overhead_percent = 5

[wallets.research.reserves.small]
funding_amount_usdc = "2.00"
max_funding_amount_usdc = "3.00"

# Company, markets, crypto and world share the financials payer.
[wallets.financials]
mode = "zcash_rotation"
max_api_payment_usdc = "1.00"
max_conversion_overhead_percent = 5

[wallets.financials.reserves.small]
funding_amount_usdc = "2.00"
max_funding_amount_usdc = "3.00"

# Selection uses exclusions so newly added supported provider tools are enabled
# by default. Family exclusions retain existing category boundaries and source
# choices, including future tools in excluded families. Other omitted tools are
# listed individually. A new tool from a shared provider can appear on multiple
# endpoints until explicitly categorized here.
# Cross-provider price/coverage pruning is deferred until live comparisons.
#
# --- Sources -----------------------------------------------------------------
# One source per provider. Category assignment happens on the listeners; that
# also means a provider used by several categories is downloaded only once.

[sources.exa]
extends = "../../providers/exa.toml"

[sources.google_trends]
extends = "../../providers/google-trends.toml"

