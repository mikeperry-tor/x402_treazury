]

[sources.ipintel]
extends = "../../providers/ipintel.toml"
exclude_tools = [
  "ipintel_base64_*", # Prefer local encoding/decoding over paid remote computation.
  "ipintel_domain_*", # Health overlaps Otto DNS; availability deliberately omitted from this deployment.
  "ipintel_dns_lookup", # Otto costs the same $0.001 and adds CNAME/parsed email-auth; CAA/types alone do not justify duplication.
