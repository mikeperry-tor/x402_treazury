  "agosint_help", # Inline tool guidance covers lookups without manual payment instructions.
]

[sources.relayshield]
extends = "../../providers/relayshield.toml"
exclude_tools = [
  "relayshield_intent_*", # External payment bindings/attestations; outside our research workflow.
  "relayshield_scamkit_*", # Specialist fingerprinting/matching; deliberately omitted for focus.
  # URL scan lacks VirusTotal result polling; EVM wallet scan overlaps broader wallet_risk at twice the price.
  "relayshield_scan_*",
  "relayshield_v1_*", # Keep public checks and passport/TAP workflows excluded by operator choice.
  "relayshield_bulk_identity_risk", # $2 exceeds the $0.50 security payment cap; use targeted checks.
  "relayshield_campaign_scan", # $5.50 exceeds the cap; use targeted checks instead of campaign aggregation.
  "relayshield_cert_expiry", # Narrow CT-based expiry check; AgOSINT domain already includes TLS details.
  "relayshield_help", # Inline schemas cover selected tools; guide includes metered/account workflows.
  "relayshield_llm_credential_exposure", # Possible overlap with nhi_exposure; distinct coverage unverified.
  "relayshield_nft_security", # Specialist NFT screening deliberately omitted for focus.
  "relayshield_phone_reputation", # Same tool name is supplied by the phone companion source below.
  "relayshield_prompt_injection_breach", # Account exposure overlaps session_risk/infostealer; not prompt-content analysis.
  "relayshield_secret_scan_text", # Paid upload of text/diffs for pattern matching; prefer local secret scanning.
  "relayshield_target_risk", # Same six signal families as identity_risk_score, at $0.50 versus $0.35.
  "relayshield_token_security", # Crypto already offers Otto GoPlus screening at $0.001 versus $0.05; no proven added coverage.
  "relayshield_wallet_screen_batch", # $0.50 equals ten wallet_risk calls; singles cost less for smaller sets.
]

[sources.relayshield_phone]
extends = "../../providers/relayshield/phone-reputation.toml"

[sources.netintel]
extends = "../../providers/netintel.toml"
exclude_tools = [
  # Model gateways and text processing: outside the selected infrastructure research scope.
  "netintel_api_*",
  "netintel_extract_*",
  "netintel_openai_*",
  "netintel_schema_*",
  "netintel_text_*",
  "netintel_translate_*",
  "netintel_v1_*",
  # Financial and weather tools are covered by the dedicated endpoints/providers.
  "netintel_crypto_*",
  "netintel_currency_*",
  "netintel_prediction_*",
  "netintel_wallet_*",
  "netintel_weather_*",
  # Domain bundles/acquisition/watch tools add overlapping summaries or separate monitoring workflows.
  # Otto supplies DNS/registration; AgOSINT supplies domain/company enrichment; targeted checks remain enabled.
  "netintel_domain_*",
  "netintel_dns_lookup", # Otto DNS costs $0.001 versus $0.002 and includes parsed email-auth posture.
  "netintel_whois_rdap_lookup", # Otto supplies core RDAP fields for $0.001 versus $0.003; extra grading is lower priority.
  "netintel_ip_geo_locate", # Prefer IPIntel's $0.003 enrichment with PTR and proxy/mobile/hosting flags over $0.002 geo alone.
  "netintel_asn_lookup_analyze", # IPIntel covers basic ASN; AgOSINT adds prefixes/RPKI for $0.015 versus $0.03 here.
  "netintel_ssl_cert", # Prefer richer ssl_analyze ($0.007); AgOSINT domain also includes basic TLS facts.
  "netintel_url_safety_full", # $0.15 bundle overlaps enabled targeted URL, TLS and header checks.
  "netintel_ip_risk_score", # Overlaps retained full IP report; narrower IPIntel/reputation/blacklist checks also available.
  # Email checks overlap Otto email-auth DNS and social's email-validation tools; skip additional bundles.
  "netintel_email_*",
  # Calendar/event extraction and general web/search tools are outside this security selection.
  "netintel_event_*",
  "netintel_exa_*",
  "netintel_web_*",
  "netintel_calendar_ics",
  "netintel_og_scraper_extract",
  "netintel_page_extract_read",
  "netintel_pdf_parse",
  "netintel_robots_txt_analyze",
  "netintel_rss_parser_fetch",
  "netintel_sitemap_parser_fetch",
  "netintel_wayback_lookup",
  # Remote model/compute helpers are redundant with agent or local tooling.
  "netintel_ai_image_generate",
  "netintel_classify",
  "netintel_content_moderate",
  "netintel_convert",
  "netintel_cron_parser_explain",
  "netintel_embeddings",
