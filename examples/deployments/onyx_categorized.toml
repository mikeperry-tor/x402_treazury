  # Lower-priority standalone utilities and metadata; omit to keep discovery focused.
  "netintel_breach_check_password", # Uploads a password to this vendor; local HIBP prefix checks are preferable.
  "netintel_bulk_domain_check", # Domain-acquisition workflow; availability can be wrong when RDAP/DNS are unreachable.
  "netintel_github_intel_analyze", # Public repo metadata overlaps social's GitHub coverage; not a code/security audit.
  "netintel_npm_intel_analyze", # Package metadata/activity scoring, not a vulnerability or malware scan.
  "netintel_redirect_trace", # Narrow redirect-chain utility; lower priority than selected threat checks.
  "netintel_health", # Provider diagnostic, not research data.
  "netintel_help", # Inline schemas cover the selected tools; guide spans many excluded capabilities.
