[sources.claw402]
extends = "../../providers/claw402.toml"
# Comparison guidance from one live sample; retain complementary coverage.
# On crypto, prefer otto_funding_rates for compact per-symbol funding/OI summaries.
# Other CoinAnk tools retain broader exchange and market coverage.
# NOFX adds ranking screens; Vergex adds detailed order-flow rankings.
# kronos_funding_arb_asset adds normalized, fee-adjusted funding spreads;
# x402stock_perps_coin provides detailed Hyperliquid market state.
exclude_tools = [
  # Prefer otto_funding_rates for compact per-symbol summaries. The sampled
  # CoinAnk response was ~1.3 MB and contained stale/conflicting funding fields.
  "claw402_coinank_funding_rate_current",
  "claw402_ai_*",                       # Model workflows are outside this research deployment.
  # Incremental synchronization is omitted; use fresh search/profile calls for ad hoc research.
  "claw402_crypto_rootdata_changes",
  "claw402_crypto_rootdata_credits",     # Provider credit diagnostic, not research data.
  "claw402_crypto_rootdata_id_map",      # Search supplies IDs for targeted lookups; omit the bulk map.
  "claw402_crypto_rootdata_twitter_map", # Use project/org/people for individual entities; omit bulk X export.
]

[sources.deepline]
