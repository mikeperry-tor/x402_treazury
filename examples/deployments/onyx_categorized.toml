# Re-enabled disabled tools: github profile/repository tools (unique GitHub
# research), web_ask/crawl/extract/markdown (unique fetchers).
# Excluded: socialfetch_web_search (Exa is the canonical web search).
[sources.socialfetch]
extends = "../../providers/socialfetch.toml"
exclude_tools = ["socialfetch_web_search"] # XXX: compare to exa

[sources.pdl]
extends = "../../providers/pdl.toml"

[sources.arkham]
