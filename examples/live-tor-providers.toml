# TEMPLATE ONLY. Copy to live-tor-providers.local.toml and follow tests/live/INTEGRATION.md.
# No funding starts by default. Failed catalogs are recorded in coverage.json.
version = 1
[network]
mode = "tor"
socks_endpoint = "127.0.0.1:9150"
isolation_namespace = "qualification_replace_me"
socks_auth = "tor_extended"
connect_timeout_seconds = 120
request_timeout_seconds = 240
[treasury]
id = "11111111-1111-4111-8111-111111111111"
state_dir = "../state/qualification-template"
key_file = "../secrets/qualification-template.key"
indexer_url_env = "ZCASH_INDEXER_URL"
submission_url_env = "ZCASH_SUBMISSION_URL"
daily_input_zec = "0.0105"
shield_max_fee_zec = "0.0003"
confirmations = 3
max_sync_age_seconds = 300
[funding]
auto_fund = false
confidentiality = "public"
base_rpc_url_env = "BASE_RPC_URL"
# Reviewed Tor test endpoint: export BASE_RPC_URL=https://base-rpc.publicnode.com
# Verification remains required; omitted fallback settings retain dRPC/Base failover.
base_confirmations = 12
[wallets.coverage_a]
mode = "zcash_rotation"
# Review the current bridge minimum before authorizing new funding.
# It is not a universal or permanent route minimum.
deposit_size = "2.00"
max_price_usd = "0.20"
max_input_zec = "0.002"
max_fee_bps = 500
[wallets.coverage_b]
mode = "zcash_rotation"
deposit_size = "2.00"
max_price_usd = "0.20"
max_input_zec = "0.002"
max_fee_bps = 500

