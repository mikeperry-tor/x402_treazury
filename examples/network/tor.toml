# Deployment or standalone commands: --network-config examples/network/tor.toml
# Replaces [network] and [discovery_relay]; alternatively embed both in --config.
# Relay settings apply to deployment reads; standalone/wallet commands use Tor only.
# Tor Browser must already be running on the configured SOCKS port.
[network]
mode = "tor"
# Cover ranges default on; uncomment to disable globally.
# cover_traffic_enabled = false
socks_endpoint = "127.0.0.1:9150"
isolation_namespace = "x402_treazury"
socks_auth = "tor_extended"
connect_timeout_seconds = 120
read_timeout_seconds = 60
# Fresh isolation attempts after the initial unsigned request; zero means one attempt.
tor_isolation_retries = 2

# Ordered paid fallback after eligible origin attempts, using existing deployment payers.
[discovery_relay]
source_discovery = true # directory search and service metadata
api_requests = false # opt in to disclose actual API requests
provider_metadata = true # schemas/help, startup and explicit non-direct warming

# Select by original target method; absent/empty lists mean origin-only.
[discovery_relay.fallbacks]
GET = ["../../providers/curl/provider.toml", "../../providers/agproxy.toml"]
POST = ["../../providers/agproxy.toml"]
HEAD = ["../../providers/agproxy.toml"]
