[package]
"name" = "pepper-sync"
"description" = "Pepper-sync is a crate providing a sync engine for the zcash network."
"authors" = ["<zingo@zingolabs.org>"]
"version" = "0.5.0"
"edition" = "2024"
"repository" = "https://github.com/zingolabs/zingolib"
"homepage" = "https://github.com/zingolabs/zingolib"
"license" = "MIT"
"autotests" = false
"autoexamples" = false
"autobenches" = false

[features]
"default" = ["wallet_essentials"]
"wallet_essentials" = ["dep:byteorder", "dep:zcash_encoding"]
"test-features" = []

[dependencies]
"zingo-memo" = {"git" = "https://github.com/zingolabs/zingolib", "rev" = "c6381534f802b1022041beda4b01c106ad132329"}
"zingo-status" = {"git" = "https://github.com/zingolabs/zingolib", "rev" = "c6381534f802b1022041beda4b01c106ad132329"}
"zingo-netutils" = {"features" = ["globally-public-transparent"], "git" = "https://github.com/zingolabs/zingolib", "rev" = "c6381534f802b1022041beda4b01c106ad132329"}
"incrementalmerkletree" = {"version" = "0.8.2"}
"orchard" = {"version" = "0.15.0"}
"sapling-crypto" = {"version" = "0.7.0"}
"shardtree" = {"version" = "0.7.0"}
"zcash_address" = {"version" = "0.13.0"}
"zcash_client_backend" = {"version" = "0.24.0-rc.7", "features" = ["orchard", "transparent-inputs", "unstable-serialization"]}
"zcash_encoding" = {"version" = "0.4.0", "optional" = true}
"zcash_keys" = {"version" = "0.16.1", "features" = ["transparent-inputs", "sapling", "orchard"]}
"zcash_note_encryption" = {"version" = "0.4.2"}
"zcash_primitives" = {"version" = "0.30.0", "features" = ["non-standard-fees"]}
"zcash_protocol" = {"version" = "0.10.4"}
"zcash_transparent" = {"version" = "0.10.0"}
"bip32" = {"version" = "0.6.0-pre.1", "default-features" = false}
"zip32" = {"version" = "0.2.0"}
"jubjub" = {"version" = "0.10.0"}
"subtle" = {"version" = "2.6.1"}
"futures" = {"version" = "0.3"}
"tokio" = {"version" = "1"}
"tonic" = {"version" = "0.14", "features" = ["tls-webpki-roots", "tls-aws-lc"]}
"tracing" = {"version" = "0.1"}
"memuse" = {"version" = "0.2"}
"crossbeam-channel" = {"version" = "0.5"}
"rayon" = {"version" = "1"}
"thiserror" = {"version" = "2"}
"json" = {"version" = "0.12"}
"byteorder" = {"version" = "1", "optional" = true}
"hex" = {"version" = "0.4"}
"simple-mermaid" = {"version" = "0.2.0"}

[badges]
"maintenance" = {"status" = "actively-developed"}

[dev-dependencies]
proptest = "1.6.0"
zcash_protocol = { version = "0.10.4", features = ["local-consensus"] }
