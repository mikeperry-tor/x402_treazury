[package]
"name" = "zingolib"
"description" = "Zingo backend library."
"version" = "6.0.0"
"authors" = ["<zingo@zingolabs.org>"]
"edition" = "2024"
"repository" = "https://github.com/zingolabs/zingolib"
"homepage" = "https://github.com/zingolabs/zingolib"
"license" = "MIT"
"autotests" = false
"autoexamples" = false
"autobenches" = false

[features]
"default" = []
"perspective" = []
"nym" = ["zingo-netutils/socks5-transmit", "zingo-price/socks5-fetch"]
"testutils" = ["perspective", "portpicker", "zingo_test_vectors", "tempfile", "pepper-sync/test-features", "dep:zaino-proto", "dep:tokio-stream"]

[dependencies]
"append-only-vec" = {"version" = "0.1.7"}
"bech32" = {"version" = "0.11.0"}
"bip0039" = {"version" = "0.14", "features" = ["rand"]}
"bip32" = {"version" = "0.6.0-pre.1", "default-features" = false, "features" = ["secp256k1-ffi"]}
"blake2b_simd" = {"version" = "1"}
"bs58" = {"version" = "0.5", "features" = ["check"]}
"byteorder" = {"version" = "1"}
"chrono" = {"version" = "0.4"}
"dirs" = {"version" = "6"}
"futures" = {"version" = "0.3"}
"hex" = {"version" = "0.4"}
"http" = {"version" = "1"}
"incrementalmerkletree" = {"version" = "0.8.2"}
"json" = {"version" = "0.12"}
"jubjub" = {"version" = "0.10.0"}
"log" = {"version" = "0.4"}
"nonempty" = {"version" = "0.11.0"}
"orchard" = {"version" = "0.15.0"}
"pepper-sync" = {"git" = "https://github.com/zingolabs/zingolib", "rev" = "c6381534f802b1022041beda4b01c106ad132329"}
"portpicker" = {"version" = "0.1", "optional" = true}
"prost" = {"version" = "0.14"}
"hmac" = {"version" = "0.12"}
"rand" = {"version" = "0.8"}
"rust-embed" = {"version" = "8", "features" = ["debug-embed"]}
"sapling-crypto" = {"version" = "0.7.0"}
"sha2" = {"version" = "0.10"}
"secp256k1" = {"version" = "0.31.1"}
"secrecy" = {"version" = "0.8"}
"serde" = {"version" = "1", "features" = ["derive"]}
"shardtree" = {"version" = "0.7.0", "features" = ["legacy-api"]}
"tempfile" = {"version" = "3", "optional" = true}
"thiserror" = {"version" = "2"}
"tokio" = {"version" = "1", "features" = ["full"]}
"tracing" = {"version" = "0.1"}
"zcash_address" = {"version" = "0.13.0"}
"zcash_client_backend" = {"version" = "0.24.0-rc.7", "features" = ["orchard", "transparent-inputs", "unstable", "unstable-serialization", "unstable-spanning-tree"]}
"zcash_encoding" = {"version" = "0.4.0"}
"zcash_keys" = {"version" = "0.16.1", "features" = ["transparent-inputs", "sapling", "orchard"]}
"zcash_primitives" = {"version" = "0.30.0", "features" = ["non-standard-fees"]}
"zcash_proofs" = {"version" = "0.30.0"}
"zcash_protocol" = {"version" = "0.10.4"}
"zcash_transparent" = {"version" = "0.10.0"}
"zingo-memo" = {"git" = "https://github.com/zingolabs/zingolib", "rev" = "c6381534f802b1022041beda4b01c106ad132329"}
"zingo-netutils" = {"features" = ["globally-public-transparent"], "git" = "https://github.com/zingolabs/zingolib", "rev" = "c6381534f802b1022041beda4b01c106ad132329"}
"zingo-price" = {"default-features" = false, "git" = "https://github.com/zingolabs/zingolib", "rev" = "c6381534f802b1022041beda4b01c106ad132329"}
"zingo-status" = {"git" = "https://github.com/zingolabs/zingolib", "rev" = "c6381534f802b1022041beda4b01c106ad132329"}
"zingo_common_components" = {"version" = "0.4.0"}
"zingo_test_vectors" = {"git" = "https://github.com/zingolabs/infrastructure.git", "rev" = "89cf104a2416144d1bbbae30aca02bec062d1492", "optional" = true}
"zip32" = {"version" = "0.2.0"}
"zaino-proto" = {"version" = "0.2.0", "default-features" = false, "features" = ["grpc_proxy_server"], "optional" = true}
"tokio-stream" = {"version" = "0.1", "optional" = true}
"zcash_pool_migration" = {"version" = "0.1.0-rc.7", "default-features" = false}
"zingo-net-diag" = {"features" = ["serde"], "git" = "https://github.com/zingolabs/zingolib", "rev" = "c6381534f802b1022041beda4b01c106ad132329"}

[build-dependencies]
"zcash_proofs" = {"version" = "0.30.0", "features" = ["download-params"]}

[badges]
"maintenance" = {"status" = "actively-developed"}

