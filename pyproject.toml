[project]
name = "x402-mcp"
version = "0.1.0"
description = "Stdio MCP servers that expose x402-paid APIs as plain MCP tools (the server holds the wallet and pays)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "x402[httpx,evm]>=2.24.0,<3",
    "mcp>=1.12.0,<2",
    "httpx>=0.28.1",
    "eth-account>=0.13.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
svm = ["x402[svm]>=2.24.0,<3"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
x402-mcp-pdl = "x402_mcp.pdl:main"
x402-mcp-deepline = "x402_mcp.deepline:main"
x402-mcp-socialfetch = "x402_mcp.socialfetch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/x402_mcp"]

[tool.uv]
