description = "Threat and breach intelligence, IP and wallet risk, supply-chain checks and URL scanning."
# x402 payg and three public keyless checks; metered/account ownership and file jobs excluded.
# /v1/payg shortens paid names; the root fallback retains distinct v1_* public names.
spec = "https://api.relayshield.net/openapi.json"
name = "RelayShield"
base_url = "https://api.relayshield.net"
prefix = "relayshield"
recommended_tools = ["relayshield_breach", "relayshield_ip_intel", "relayshield_supply_chain", "relayshield_wallet_risk", "relayshield_scan_url", "relayshield_help"]
exclude = ["/v1/metered", "/v1/account", "/v1/siem", "/v1/webhook", "/v1/payg/scan-file"]

include = ["/v1/payg", ""]

pricing_key = "x-payment-info"
# Catalog and llms.txt ignore unsigned byte ranges (HTTP 200); cover requires 206.
cover_traffic_enabled = false

read_timeout_seconds = 90

help_url = "https://api.relayshield.net/llms.txt"

instructions_text = "Threat and exposure signals. Preserve timestamps, coverage and degraded/unknown markers; missing findings do not prove safety."

[overrides.relayshield_help]
description = "Read RelayShield’s request examples and pricing. The guide uses metered paths and includes unavailable account routes; use the exposed tools."

[overrides.relayshield_ip_intel.params]
domain = "Domain to look up for reputation and passive DNS resolution history (provide `domain` or `ip`)."
ip = "IPv4/IPv6 address to look up for reputation and reverse passive DNS (provide `domain` or `ip`)."

[overrides.relayshield_supply_chain.params]
vendor_domains = "Up to 10 vendor domains to assess for combined breach, infostealer, and dark-web exposure (provide `vendor_domains` or `vendor_emails`)."
vendor_emails = "Alternative: up to 10 vendor contact emails (domains extracted automatically; provide `vendor_domains` or `vendor_emails`)."

[overrides.relayshield_secret_scan_text.params]
content = "Raw file content to scan for leaked secrets (provide `content` or `diff`; mutually exclusive)."
diff = "Unified diff where only added lines are scanned for leaked secrets (provide `content` or `diff`; mutually exclusive)."

[overrides.relayshield_tech_stack_cve.params]
tech_stack = "Required for stateless x402 calls: array of technology product names (e.g. [\"nginx\", \"PostgreSQL\", \"OpenSSL\"]) to check against CISA KEV and high-EPSS CVEs."
domain = "Stored-profile domain lookup (requires an API-key account profile; pass `tech_stack` directly on stateless x402 calls)."

[overrides.relayshield_secret_scan.params]
domain = "Primary root domain to scan across public artifact sources (provide `domain` and/or `vendor_domains`)."

[overrides.relayshield_llm_credential_exposure.params]
domain = "Primary root domain to check for exposed LLM/AI API keys (provide `domain` and/or `vendor_domains`)."

[overrides.relayshield_nhi_exposure.params]
domain = "Primary root domain to check for exposed machine/CI-CD credentials in stealer logs (provide `domain` and/or `vendor_domains`)."

[overrides.relayshield_scan_url]
description = "Scan a URL (`http://` or `https://`) for phishing or malware using synchronous heuristic signals (Google Safe Browsing, RDAP domain age, and RelayShield IOC corpus `malware_families` attribution). Also returns a VirusTotal `analysis_id`, which cannot be polled through this catalog because `GET /v1/payg/result/{analysis_id}` is omitted from `openapi.json`. Cost: ~$0.05/call [spec]."


[overrides.relayshield_v1_email_check]
description = "Screen a parsed email’s authentication, sender/name, phrasing, links and attachment names. Extract from_address, from_name, subject, body_text, links and attachment_names first; raw RFC822 is not parsed. Vendor contract: free; no payment required."

[overrides.relayshield_v1_link_check]
description = "Check criminal IOC, Google Safe Browsing and domain-age signals. Supply url or urls (up to 25). The best verdict is unknown, never safe. Public callers share a per-IP daily allowance; a batch counts once per URL. Vendor contract: free; no payment required."

[overrides.relayshield_v1_wallet_risk]
description = "Detect the chain from address and screen sanctions and abuse sources. Public callers share the link-check per-IP allowance. Vendor contract: free; no payment required."

[overrides.relayshield_breach]
description = "Check whether an email address appears in known data breaches. Returns breach count, source names, dates, and exposed data types (passwords, emails, etc). Call before trusting a new user identity or granting elevated access. Cost: ~$0.10/call [spec]. Vendor bills successful calls."

[overrides.relayshield_identity_graph]
description = "Correlate an email address against the criminal breach/stealer corpus to surface linked phone numbers, secondary domains, and other identifiers tied to the same compromised identity. Call to map the blast radius of a known compromise across an organization. Cost: ~$0.35/call [spec]. Vendor bills successful calls."

[overrides.relayshield_identity_risk_score]
description = "Return a domain security score (0–100), grade and factors across breach, infostealer, ransomware, session, CVE and threat-actor exposure. Cost: ~$0.35/call [spec]. Vendor bills successful calls."

[overrides.relayshield_infostealer]
description = "Check whether an email address's credentials were harvested by infostealer malware and appear in a criminal stealer-log marketplace. Call to catch device-level compromise before stolen session cookies or saved passwords are used for account takeover. Cost: ~$0.15/call [spec]. Vendor bills successful calls."

[overrides.relayshield_ip_intel]
description = "Look up passive DNS resolution history and reputation for a domain or IP address. For a domain: which IPs it has resolved to over time. For an IP: which hostnames have resolved to it, plus malicious/suspicious vendor detection counts. Call to pivot from an indicator to its infrastructure history during an investigation. Cost: ~$0.10/call [spec]. Vendor bills successful calls."

[overrides.relayshield_ransomware_risk]
description = "Check whether a domain appears on a known ransomware group's victim/leak-site list, and whether pre-ransomware credential harvesting was detected beforehand. Call to assess active ransomware exposure for a domain, not just historical breach history. Cost: ~$0.40/call [spec]. Vendor bills successful calls."

[overrides.relayshield_secret_scan]
description = "Scan public GitHub, npm, PyPI, Docker Hub, Hugging Face and Postman artifacts for exposed credential patterns associated with domain and/or vendor_domains. Cost: ~$0.35/call [spec]. Vendor bills successful calls."

[overrides.relayshield_sim_swap]
description = "Check recent SIM-swap or carrier-port signals for phone (E.164). Vendor carrier availability is degraded/unavailable; a failed lookup supplies no verdict. Cost: ~$0.25/call [spec]. Vendor bills successful calls."

[overrides.relayshield_supply_chain]
description = "Check up to 10 vendor domains for combined breach, infostealer, and dark-web risk exposure in one call. Returns a composite risk score per vendor. Call to assess third-party API/vendor risk before an agent integrates with or continues calling an external service. Cost: ~$0.10/call [spec]. Vendor bills successful calls."

[overrides.relayshield_tech_stack_cve]
description = "Check tech_stack product names against CISA KEV and high-EPSS CVEs. Supply the declared stack directly; domain requires an unavailable stored account profile. Cost: ~$0.20/call [spec]. Vendor bills successful calls."

[overrides.relayshield_wallet_risk]
description = "Screen address for scam, exploit, drainer and sanctions associations. Preserve observed_at, valid_for_seconds, expires_at and degraded. Vendor freshness: flagged 24h, clean 1h, degraded 5m; missing signals do not prove safety. Cost: ~$0.05/call [spec]. Vendor bills successful calls."

[overrides.relayshield_scamkit_fingerprint]
description = "Fingerprint a phishing kit using url or html, or supply kind=\"malware\" with signals. URL fetching uses static HTML without JavaScript; supply rendered html for JS-heavy pages. observed_telemetry is caller-supplied; JA3/JA4 is not computed. Supplied html has no URL malware attribution. Preserve family_status (approved/suggested), confidence and evidence. Cost: ~$0.50/call [spec]. Vendor bills successful calls."

[overrides.relayshield_campaign_scan]
description = "Scan up to 25 campaign indicators; supply at least one indicator array. Returns correlated findings, per-indicator results, citations and per-endpoint errors. Preserve degraded=true and truncated_subcalls when upstream results are incomplete. Cost: ~$5.50/call [spec]. Vendor bills successful calls."
