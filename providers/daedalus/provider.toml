pricing_key = "x-payment-info"
help_url = "https://agents.daedalusdevelopmentgroup.com/llms.txt"
instructions_text = "Supply your stable X-Agent-Id when requested; use the same identity for related calls. Signed DDG verdicts attest the vendor's checks, not completeness or independent certification. Preserve unknowns and evidence scope."

