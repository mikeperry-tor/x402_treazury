description = "Agent-service audits, provenance verification, public-data lookups and developer research."
# Request snapshot repairs missing AgentIdentity header parameters; see CAVEATS.md.
spec = "openapi.json"
name = "Daedalus"
base_url = "https://agents.daedalusdevelopmentgroup.com"
prefix = "daedalus"
include = ["/v1", ""]
# Remote mail/key/watch/wake ownership and queued artifact retrieval need a separate lifecycle.
exclude = ["/a2a", "/v1/audit/mutual", "/v1/reputation/alert", "/v1/reputation/alerts", "/v1/sla/declare", "/v1/sla/report", "/v1/comms/proof", "/v1/inbox/register", "/v1/inbox/messages", "/v1/inbox/status", "/v1/inbox/settings", "/v1/im", "/v1/heartbeat/register", "/v1/heartbeat/status", "/v1/sla/monitor", "/v1/order-status", "/v1/mail/ack", "/v1/mail/fetch", "/v1/mail/inbox", "/v1/mail/keys/register", "/v1/mail/send", "/v1/mail/threads", "/v1/orders", "/v1/wake", "/v1/trust/watch", "/v1/tine-artifacts"]
