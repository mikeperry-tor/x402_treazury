description = "Corporate registry, company due diligence, domain, network, VAT and sanctions intelligence."
# Catalog/help and tested same-origin static paths did not support unsigned byte ranges.
# Disable optional cover; ordinary API requests retain their configured network policy.
cover_traffic_enabled = false
# Registry fan-out: /x402 anchors names; MPP aliases are the unsupported payment rail.
spec = "https://agosint.shveik.dev/openapi.json"
name = "AgOSINT"
# Pin root base_url because servers[0] in the vendor spec appends /v1, which breaks /x402/* paths.
base_url = "https://agosint.shveik.dev"
prefix = "agosint"
include = ["/x402", ""]
exclude = ["/mpp"]
pricing_key = "x-payment-info"
read_timeout_seconds = 120
help_url = "https://agosint.shveik.dev/llms.txt"
instructions_text = "Registry and sanctions research. Validate lookup keys before calling: invalid bodies can receive a quote and fail validation after payment."

[overrides.agosint_help]
description = "Read AgOSINT’s registry and request guide. Its manual payment/retry and MPP setup instructions do not apply to these tools."

[overrides.agosint_company.params]
id = "National company number. Mutually exclusive with name, lei, vat, and domain; requires country."
name = "Legal name to search. Mutually exclusive with id, lei, vat, and domain; requires country."

[overrides.agosint_due_diligence.params]
id = "National company number. Mutually exclusive with name, lei, vat, and domain; requires country."
name = "Company name. Mutually exclusive with id, lei, vat, and domain; requires country."

[overrides.agosint_network.params]
asn = "Autonomous System Number (e.g. AS13335 or 13335). Pass exactly one of asn or ip, never both."
ip = "IPv4 or IPv6 address. Pass exactly one of ip or asn, never both."

[overrides.agosint_sanctions.params]
name = "Person, company, vessel, or aircraft name. Pass exactly one of name or wallet."
wallet = "Crypto address (BTC, ETH, TRON, USDT, etc.). Pass exactly one of wallet or name; birth_date, country, kind, and threshold are not used with wallet."

[overrides.agosint_company]
description = "Look up a legal entity in Czechia, Norway, UK, France, Finland, US SEC or GLEIF. Pass exactly one of id, name, lei, vat or domain; country is required with id/name and unused with other keys. Cost: ~$0.02/call [spec]."

[overrides.agosint_company_de]
description = "Retrieve German Handelsregister records, officers and history. Prefer small limit batches; registry fan-out can take 90–120 seconds. Cost: ~$0.056–$0.152/call [spec]."

[overrides.agosint_due_diligence]
description = "Combine official registry identity, LEI/parents, VAT validation, company/officer sanctions and domain checks with sources. Pass exactly one of id, name, lei, vat or domain; country is required with id/name and unused with other keys. Cost: ~$0.10/call [spec]."

[overrides.agosint_domain]
description = "Retrieve domain registration, DNS/mail security, TLS, hosting and identifiable company information. These are phishing-risk signals, not a legitimacy guarantee. Cost: ~$0.015/call [spec]."

[overrides.agosint_network]
description = "Look up network ownership, announced prefixes, origin AS, country, RPKI status and abuse contact. Pass exactly one public IP address or ASN (autonomous system number). Cost: ~$0.015/call [spec]."

[overrides.agosint_vat]
description = "Validate EU VAT through VIES or Norwegian VAT through the national register. Returns registered name/address and, when caller VAT is supplied, a VIES consultation number. Cost: ~$0.015/call [spec]."

[overrides.agosint_sanctions]
description = "Screen official OFAC, EU and UK lists with match scores and publication dates. Pass exactly one of name or wallet; birth_date, country, kind and threshold apply only to name. A screening aid, not a compliance determination. Cost: ~$0.015/call [spec]."
