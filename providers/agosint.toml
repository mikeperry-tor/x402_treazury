# Registry fan-out: /x402 anchors names; MPP aliases are the unsupported payment rail.
spec = "https://agosint.shveik.dev/openapi.json"
name = "AgOSINT"
# Pin root base_url because servers[0] in the vendor spec appends /v1, which breaks /x402/* paths.
base_url = "https://agosint.shveik.dev"
prefix = "agosint"
include = ["/x402", ""]
exclude = ["/mpp"]
pricing_key = "x-payment-info"
probe_pricing = false
read_timeout_seconds = 120
help_url = "https://agosint.shveik.dev/llms.txt"
instructions_text = "AgOSINT corporate, registry, network, domain, VAT and sanctions intelligence via x402 USDC on Base. Supply valid mutually exclusive lookup keys before calling: an invalid body still receives an unpaid 402 quote (with X-Agdata-Invalid-Request: 1) before failing with 400 after payment signing. For agosint_company and agosint_due_diligence pass exactly one of id, name, lei, vat, or domain (country is required with id or name, and not used with lei, vat, or domain). For agosint_network pass exactly one of ip or asn. For agosint_sanctions pass exactly one of name or wallet (birth_date, country, kind, and threshold apply only to name). Live multi-registry fan-out (especially agosint_company_de) can take up to 90–120 seconds. Treazury handles x402 payment automatically and never replays signed payment headers on HTTP 202 or timeouts; missing receipts do not prove nothing was charged."

[overrides.agosint_help]
description = "Read AgOSINT's agent guide, fetched on demand and cached for this process. It also covers duplicate /mpp/* paths, Solana/MPP payment options, Idempotency-Key headers, and manual payment-retry advice that do not apply to Treazury."

[overrides.agosint_company.params]
id = "National company number. Mutually exclusive with name, lei, vat, and domain; requires country."
name = "Legal name to search. Mutually exclusive with id, lei, vat, and domain; requires country."

[overrides.agosint_due_diligence.params]
id = "National company number. Mutually exclusive with name, lei, vat, and domain; requires country."
name = "Company name. Mutually exclusive with id, lei, vat, and domain; requires country."

[overrides.agosint_network.params]
asn = "Autonomous System Number (e.g. AS13335 or 13335). Pass exactly one of asn or ip, never both."
ip = "IPv4 or IPv6 address. Pass exactly one of ip or asn, never both."

[overrides.agosint_sanctions.params]
name = "Person, company, vessel, or aircraft name. Pass exactly one of name or wallet."
wallet = "Crypto address (BTC, ETH, TRON, USDT, etc.). Pass exactly one of wallet or name; birth_date, country, kind, and threshold are not used with wallet."

