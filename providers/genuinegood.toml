description = "US federal grant search, award details, fit analysis and research briefs."
# Reusable Rust provider settings. Paths are relative to this file.
spec = "https://genuinegood.online/openapi.json"
name = "Genuine Good Grants"
base_url = "https://genuinegood.online"
prefix = "genuinegood"
recommended_tools = ["genuinegood_search", "genuinegood_detail", "genuinegood_help"]
include = ["/v1/grants", ""]
exclude = ["/v1/grants/pass"]
pricing_key = "x-payment-info"
additional_properties = false
help_url = "https://genuinegood.online/llms.txt"
instructions_text = "Search opportunities, then fetch detail by opportunityId for the official notice. Fit, brief and preflight are research aids; verify decisions against the linked Grants.gov notice. Preflight is advertised at $5 and may exceed the configured payment cap."
