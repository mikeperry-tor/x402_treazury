description = "Public social profiles, posts, captions and engagement; shopping, product prices, reviews and recalls from SiteCheck."
spec = "https://api.shopsocial-api.workers.dev/openapi.json"
name = "SiteCheck Shop & Social"
base_url = "https://api.shopsocial-api.workers.dev"
prefix = "shopsocial"
include = ["/api", ""]
pricing_key = "x-payment-info"
help_url = "https://api.shopsocial-api.workers.dev/llms.txt"
instructions_text = "Preserve source URLs, observation dates, public-view coverage, unavailable fields and per-item failures. Public feeds and page previews do not establish complete history, hidden contacts or private content."

[overrides.shopsocial_help]
description = "Read SiteCheck's social and shopping endpoint guide, prices and public-source coverage. Use exposed schemas for exact inputs."

[overrides.shopsocial_social_instagram_reel]
description = "Read recent reels/videos among a public account's 12 newest grid posts and newest IGTV items, including captions, times, engagement and duration. View counts are null. Does not cover the complete reels tab or single-reel lookup; throttling can return 503 and unknown users 404."
pricing_description = "Cost: ~$0.005/call [spec]. Failed fetches returning 503 are not charged."

[overrides.shopsocial_social_instagram]
description = "Read public Instagram engagement over the 12 newest posts: follower/post counts, per-post engagement rates, averages, median likes, best post and posting frequency. Comment counts only; hidden likes are null. Throttling can return 503 and unknown users 404."
pricing_description = "Cost: ~$0.005/call [spec]. Failed fetches returning 503 are not charged."

[overrides.shopsocial_social_instagram_contact]
description = "Read public Instagram bio links and email/phone-like bio text. Business email, phone and address buttons are null for logged-out visitors. Unknown users return 404; blocked or failed fetches return 503."
pricing_description = "Cost: ~$0.002/call [spec]. Failed or blocked fetches returning 503 are not charged."

[overrides.shopsocial_social_instagram_posts]
description = "Read the 12 newest public Instagram grid posts with URLs, captions, times, engagement, media, duration and location. No pagination or comment text; private accounts return empty lists, throttling can return 503 and unknown users 404."
pricing_description = "Cost: ~$0.005/call [spec]. Failed fetches returning 503 are not charged."

[overrides.shopsocial_social_instagram_profile]
description = "Read public Instagram identity, bio/links, verification/privacy flags, profile picture and follower/following/post counts. Business category and reel/highlight counts are null for logged-out visitors. Unknown users return 404; blocked or failed fetches return 503."
pricing_description = "Cost: ~$0.002/call [spec]. Failed or blocked fetches returning 503 are not charged."

[overrides.shopsocial_social_instagram_related_profiles]
description = "Read Instagram's suggested related accounts with IDs, names, verification/privacy flags and pictures. No related-account follower counts; empty suggestions are valid, throttling can return 503 and unknown users 404."
pricing_description = "Cost: ~$0.02/call [spec]. Failed fetches returning 503 are not charged."

[overrides.shopsocial_social_youtube_transcript]
description = "Read YouTube caption languages and a chosen track as timed segments plus joined text, title/channel and duration. Human captions are preferred; videos without captions return empty segments, private/removed videos 404 and bot checks 503."
pricing_description = "Cost: ~$0.002/call [spec]. Failed or blocked fetches returning 503 are not charged."
