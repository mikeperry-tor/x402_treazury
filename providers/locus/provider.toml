description = "Cited US property and public-record context, zoning, permits, flood and environmental reports."
# Reusable Rust provider settings. Paths are relative to this file.
spec = "openapi.json"
name = "Locus — US property & public-records context"
base_url = "https://api.locus.report"
prefix = "locus"
include = ["/api", "/tools", ""]
help_url = "https://api.locus.report/llms.txt"
instructions_text = "Use locus_list(compact=true), then locus_call(name=..., arguments={...}) for free coverage_check, lane_availability, place_facts or suggest_workflow before paid reports. Unsupported places return a free diagnostic instead of a charge. Unified manifests include both free and paid schemas. X-Locus-Report-* response headers are unavailable over MCP. Do not use Locus for tenant screening, lending, insurance, employment, background checks, appraisal, valuation, policing or safe/unsafe labels."
pricing_key = "x-payment-info"
