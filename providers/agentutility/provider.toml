description = "Web research, patents, scraping, structured extraction, supplied-code audits and developer data utilities."
# Reviewed same-origin cover resources ignore Range or are unavailable; see providers/CAVEATS.md.
cover_traffic_enabled = false

# Tagged request snapshot: regenerate with the Rust snapshot_agentutility example.
spec = "openapi.json"
name = "AgentUtility"
base_url = "https://x402.agentutility.ai"
prefix = "agentutility"
include = [""]
# Watch-page retains caller-selected remote state and needs a distinct ownership contract.
exclude_operations = ["POST /watch-page"]
recommended_tools = ["agentutility_web_search", "agentutility_answer_web", "agentutility_research_brief", "agentutility_scrape", "agentutility_scrape_to_json", "agentutility_link_extract", "agentutility_archive_snapshot", "agentutility_arxiv_search", "agentutility_arxiv_summarize", "agentutility_pubmed_search", "agentutility_hn_search", "agentutility_wikipedia_search", "agentutility_github_readme", "agentutility_youtube_transcript", "agentutility_pdf_to_markdown", "agentutility_help"]
pricing_key = "x-payment-info"
read_timeout_seconds = 90
help_url = "https://agentutility.ai/llms.txt"
instructions_text = "Preserve degraded, partial, truncated and component-error markers; web search may return a marked news fallback. Browser, IPFS and QR results remain JSON, including encoded media and hosted links. Satellite images become MCP attachments with attribution and metadata retained."

[overrides.agentutility_help]
description = "Read AgentUtility's catalog and usage guide. It also covers other clients and unsupported tools; use exposed tool schemas and actual result fields."

[response_mappings."POST /satellite-address"]
images = [{ pointer = "/data_base64", mime_pointer = "/content_type" }]

[response_mappings."POST /satellite-bbox"]
images = [{ pointer = "/data_base64", mime_pointer = "/content_type" }]

[response_mappings."POST /satellite-tile"]
images = [{ pointer = "/data_base64", mime_pointer = "/content_type" }]

[response_mappings."POST /satellite-change"]
images = [
  { pointer = "/before/data_base64", mime_pointer = "/content_type" },
  { pointer = "/after/data_base64", mime_pointer = "/content_type" },
]

[overrides.agentutility_db_migration_risk]
description = "Audit migration files from a public repo or supplied files for destructive SQL and deployment risks. Returns a risk score and findings with locations and recommendations."

[overrides.agentutility_dep_risk_summary]
description = "Audit manifests and lockfiles from a public repo or supplied files for dependency risks. Returns a risk score and findings; registry checks sample direct dependencies."

[overrides.agentutility_deploy_config_risk]
description = "Audit deploy configuration from a public repo or supplied files for unsafe exposure and configuration. Returns a score and findings with locations and recommendations."

[overrides.agentutility_production_readiness_score]
description = "Combine source, dependency, migration, deployment and secret audits for a public repo or supplied files. Returns a readiness score, component results and ranked findings; preserve component failures."

[overrides.agentutility_prompt_injection_surface]
description = "Audit AI application source from a public repo or supplied files for prompt injection risks at model call sites. Returns a risk score and located findings with recommendations."

[overrides.agentutility_secrets_exposure_check]
description = "Audit configuration from a public repo or supplied files for hardcoded secrets and public environment leaks. Returns a risk score and findings with redacted evidence."
