description = "Web research, scraping, structured extraction and supported developer data utilities."
reliability_tags = ["upstream_rate_limited"]
reliability_note = "Paid web_search can return HTTP 424 for an upstream HTTP 429. Tor causation is not established."

# Tagged request snapshot: regenerate with the Rust snapshot_agentutility example.
spec = "openapi.json"
name = "AgentUtility"
base_url = "https://x402.agentutility.ai"
prefix = "agentutility"
include = [""]
# Full branch schemas cannot be advertised by the converter; watch-page owns remote state.
exclude_operations = ["POST /db-migration-risk", "POST /dep-risk-summary", "POST /deploy-config-risk", "POST /production-readiness-score", "POST /prompt-injection-surface", "POST /secrets-exposure-check", "POST /watch-page"]
recommended_tools = ["agentutility_web_search", "agentutility_answer_web", "agentutility_research_brief", "agentutility_scrape", "agentutility_scrape_to_json", "agentutility_link_extract", "agentutility_archive_snapshot", "agentutility_arxiv_search", "agentutility_arxiv_summarize", "agentutility_pubmed_search", "agentutility_hn_search", "agentutility_wikipedia_search", "agentutility_github_readme", "agentutility_youtube_transcript", "agentutility_pdf_to_markdown", "agentutility_help"]
pricing_key = "x-payment-info"
read_timeout_seconds = 90
help_url = "https://agentutility.ai/llms.txt"
instructions_text = "AgentUtility pay-per-call tools using x402 USDC on Base. Managed zcash_rotation wallets omit advertised x402 extensions with warnings; providers requiring extension echoes may reject payment. A rejected signed payment remains reserved until chain reconciliation. The full supported catalog and compatible aliases are available by default; research recommendations are advisory and sources can select clusters by tag. Catalog tags combine the OpenAPI and registry because the live OpenAPI omits many tags. Only persistent watch-page ownership and six unrepresentable full oneOf repo/files request schemas are excluded. One-shot browser, IPFS and QR return ordinary JSON, including encoded media; optional screenshot or SVG modes do not make the entire tool unsupported. agentutility_help fetches the large vendor guide only on demand; it describes a broader catalog and other MCP/CLI clients. Treazury owns signing: no separate vendor CLI, wallet creation, API keys or provider environment variables are required by this integration. Hosted image/audio/video/file URLs remain JSON metadata and are not automatically fetched. Satellite image payloads become MCP image attachments with original attribution and metadata retained. Preserve degraded, partial, truncated and component-error markers; search may return a marked news fallback rather than full web coverage. Some routes exceed the default payment cap or 90-second timeout. Prices in the local snapshot are estimates; the live challenge is authoritative. Do not repeat a paid call merely because its response or receipt is missing."

[overrides.agentutility_help]
description = "Read AgentUtility's large catalog and usage guide, fetched on demand and cached for the process. It includes excluded tools, other clients and broader chain support; only the supported selected tools are callable. Use the selected tools and actual result fields. Any configured document limit is reported explicitly."

[response_mappings."POST /satellite-address"]
images = [{ pointer = "/data_base64", mime_pointer = "/content_type" }]

[response_mappings."POST /satellite-bbox"]
images = [{ pointer = "/data_base64", mime_pointer = "/content_type" }]

[response_mappings."POST /satellite-tile"]
images = [{ pointer = "/data_base64", mime_pointer = "/content_type" }]

[response_mappings."POST /satellite-change"]
images = [
  { pointer = "/before/data_base64", mime_pointer = "/content_type" },
  { pointer = "/after/data_base64", mime_pointer = "/content_type" },
]
