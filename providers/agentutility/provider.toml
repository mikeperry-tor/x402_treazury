probe_pricing = false
timeout = 90
help_url = "https://agentutility.ai/llms.txt"
instructions_text = "AgentUtility pay-per-call tools using x402 USDC on Base. Use a static EVM wallet: the sampled challenge has bazaar and builder-code extensions, which managed zcash_rotation admission currently rejects. The default is a curated research subset; operators can select other clusters by tag. Catalog tags combine the OpenAPI and registry because the live OpenAPI omits many tags. Aliases and unsupported stateful/mixed-output/schema workflows are excluded. agentutility_help fetches the large vendor guide only on demand; it describes a broader catalog and other MCP/CLI clients. Treazure owns signing: no separate vendor CLI, wallet creation, API keys or provider environment variables are required by this integration. Hosted image/audio/video/file URLs remain JSON metadata and are not automatically fetched. Satellite image payloads become MCP image attachments with original attribution and metadata retained. Preserve degraded, partial, truncated and component-error markers; search may return a marked news fallback rather than full web coverage. Some routes exceed the default payment cap or 90-second timeout. Prices in the local snapshot are estimates; the live challenge is authoritative. Do not repeat a paid call merely because its response or receipt is missing."

[overrides.agentutility_help]
description = "Read AgentUtility's large catalog and usage guide, fetched on demand and cached for the process. It includes aliases, excluded tools, other clients and broader chain support; those are not automatically enabled in Treazure. Use the selected tools and actual result fields. Any configured document limit is reported explicitly."

