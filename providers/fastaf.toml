description = "Google Patents keyword search, web search, public profiles, commerce data and page extraction."
name = "FastAF"
spec = "https://api.fastaf.co/openapi.json"
base_url = "https://api.fastaf.co"
prefix = "fastaf"
help_url = "https://fastaf.co/llms.txt"
include = ["/x402/v1", ""]
exclude = ["/x402/v1/demo/search", "/x402/v1/scrape", "/x402/v1/scrape/jobs/{job_id}"]
recommended_tools = ["fastaf_patents"]

[pricing]
source = "catalog"
format = "payment-info"
unit = "call"
usd_as_usdc = true

[overrides.fastaf_patents]
description = "Search Google Patents for publication links, patent IDs, and bibliographic results. Filter by inventor, assignee, office, status, or date. Use a patent detail API for claims."

[overrides.fastaf_patents.params]
query = "Patent search keywords. Quote a known title or phrase for a tighter match."
num = "Requested page size. The upstream search can return a different number of results."

[overrides.fastaf_youtube]
description = "YouTube video search by keyword, including Shorts. Set resource to search and pass search_query. Transcript mode takes a video ID and caption language and can return no captions."

[overrides.fastaf_linkedin_jobs]
description = "Search LinkedIn public job listings by keyword. Filter by location, company, job type, work arrangement, or experience. Returns job titles, companies, locations, posting dates, and job links when available."

[overrides.fastaf_scholar]
description = "Search Google Scholar by title or keywords, or use a citation or version cluster ID. Returns titles, authors, snippets, and citation and version links when available."

[overrides.fastaf_flights]
description = "Search Google Flights for one-way and round-trip itineraries using airport IATA codes and travel dates. Returns fares, flight legs, and available price history."

[overrides.fastaf_help]
description = "Read FastAF's route and usage guide. Use its x402 routes for pay-per-call access."
