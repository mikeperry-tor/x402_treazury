description = "Web search, scraping, maps, company enrichment and supported image tools."
# Supported JSON/image catalog; only documented async/SIWX workflows are excluded.
spec = "https://stableenrich.dev/openapi.json"
name = "StableEnrich"
base_url = "https://stableenrich.dev"
prefix = "stableenrich"
recommended_tools = ["stableenrich_exa_search", "stableenrich_exa_contents", "stableenrich_firecrawl_scrape", "stableenrich_companyenrich_org_enrich", "stableenrich_help"]
exclude = ["/api/cloudflare/crawl", "/api/cloudflare/jobs", "/api/hunter/email-verifier", "/api/google-maps/aerial-view/render-video", "/api/google-maps/aerial-view/lookup-video"]
include = ["/api", ""]
pricing_key = "x-payment-info"
read_timeout_seconds = 90
help_url = "https://stableenrich.dev/llms.txt"
instructions_text = "Interpret actual HTTP bodies without assuming AgentCash’s success/data wrapper. Hosted assets remain links. Use small batches; do not repeat a paid submission to retrieve a pending result. FullEnrich requires filters and search_after pagination; verify company identity."

[overrides.stableenrich_exa_search.params]
stream = "Omit or set false. Treazury returns completed tool responses, not incremental server-sent events."

[overrides.stableenrich_exa_answer.params]
stream = "Omit or set false. Treazury returns completed tool responses, not incremental server-sent events."

[overrides.stableenrich_help]
description = "Read StableEnrich’s API reference and pricing. AgentCash tool names/wrappers and async/SIWX workflows in the guide do not apply to these tools."

[overrides.stableenrich_google_maps_text_search_partial]
description = "Search Google Maps places (partial). For pagination, repeat the full original body including textQuery with its pageToken; the token belongs to that search. Cost: ~$0.02/call [spec]."

[overrides.stableenrich_google_maps_text_search_full]
description = "Search Google Maps places (full). For pagination, repeat the full original body including textQuery with its pageToken; the token belongs to that search. Cost: ~$0.08/call [spec]."

[overrides.stableenrich_companyenrich_org_enrich]
description = "Enrich a company by domain. Verify identity: openai.com has resolved to the wrong entity; x.com returns 404, so use twitter.com. Employees/revenue are ranges; total_funding can lag funding rounds and excludes M&A. Cost: ~$0.06/call [spec]."
