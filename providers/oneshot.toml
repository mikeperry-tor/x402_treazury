description = "Synchronous web search and public service discovery."
reliability_tags = ["catalog_http_403"]
reliability_note = "Catalog access and unsigned API requests have returned HTTP 403 while help remained available. Tor causation is not established."

# Synchronous paid search plus the verified public discovery reads; owned jobs need separate support.
spec = "https://win.oneshotagent.com/openapi.json"
name = "OneShot"
base_url = "https://win.oneshotagent.com"
prefix = "oneshot"
recommended_tools = ["oneshot_search", "oneshot_help"]
include = ["/v1/tools", ""]
include_operations = ["POST /v1/tools/search", "GET /.well-known/acp/manifest.json", "GET /health", "GET /v1/soul", "GET /v1/soul/browse", "GET /v1/soul/search", "GET /v1/soul/service-types", "GET /v1/soul/stats", "GET /v1/soul/templates", "GET /v1/soul/{wallet}", "GET /v1/stats", "GET /v1/status"]
help_url = "https://docs.oneshotagent.com/api-reference/web-search.md"
instructions_text = "Search returns results inline. Public discovery tools do not provide authenticated job retrieval or account workflows."

[overrides.oneshot_search]
description = "Search the web and return structured results inline. Vendor-listed price: $0.001/request. query is 1–500 characters; max_results is 1–20 (default 5). Prefer the smallest useful count."

[overrides.oneshot_help]
description = "Read OneShot's search request and response guide. Legacy payment-header examples are not setup steps."

[overrides.oneshot_well_known_acp_manifest_json]
description = "Stripe Agent Commerce Protocol — describes the seller and products. Free."

[overrides.oneshot_health]
description = "Service health check. Free."

[overrides.oneshot_v1_soul]
description = "Browse all souls (legacy). Free."

[overrides.oneshot_v1_soul_browse]
description = "Browse souls with pagination. Free."

[overrides.oneshot_v1_soul_search]
description = "Search souls. Free."

[overrides.oneshot_v1_soul_service_types]
description = "Get standard service type taxonomy. Free."

[overrides.oneshot_v1_soul_stats]
description = "Marketplace statistics. Free."

[overrides.oneshot_v1_soul_templates]
description = "Get service templates. Free."

[overrides.oneshot_v1_soul_wallet]
description = "Reserved sub-paths (`browse`, `search`, `service-types`, `templates`, `stats`, `register`) are matched first. Free."

[overrides.oneshot_v1_stats]
description = "Public service statistics. Free."

[overrides.oneshot_v1_status]
description = "Dependency health, separate from process liveness. Free."
