description = "Public-data gateway for macroeconomics, equities, crypto, compliance and contract research."
# Reusable Rust provider settings. Paths are relative to this file.
# The gateway negotiates HTTP/1.1 (verified through Tor); TLS 1.3 remains required.
allow_http1 = true
cover_traffic_enabled = false
spec = "https://lonestaroracle.xyz/openapi.json"
name = "LoneStarOracle"
base_url = "https://lonestaroracle.xyz/api"
operation_url_extension = "x-direct-url"
prefix = "lonestar"
recommended_tools = ["lonestar_macro_macro", "lonestar_rates_rates", "lonestar_read_read", "lonestar_token_report", "lonestar_help"]
pricing_key = "x-payment-info"
additional_properties = false
help_url = "https://lonestaroracle.xyz/llms.txt"
instructions_text = "The vendor quota is 30 requests per 60 seconds across all routes. Contract audits can take minutes. authMode=free is a vendor hint, not a payment guarantee."
