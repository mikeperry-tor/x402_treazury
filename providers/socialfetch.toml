description = "Social-platform and web data search, profiles, posts and content retrieval."
# Reusable Rust provider settings. Paths are relative to this file.
spec = "https://www.socialfetch.dev/openapi.json"
name = "SocialFetch"
base_url = "https://api.socialfetch.dev"
prefix = "socialfetch"
# Health is an intentionally omitted utility, not a payment incompatibility.
exclude_operations = ["GET /health", "GET /v1/monitors", "POST /v1/monitors"]
exclude = ["/v1/whoami", "/v1/balance", "/v1/monitors/{id}", "/v1/webhook-endpoints", "/v1/webhook-deliveries"]
include = ["/v1", ""]
exclude_tags = ["Auth"]
pricing_key = "x-socialfetch-credits-pricing"
# API-origin catalog/help ignored byte ranges in the 2026-10-16 probe; HTTP/2
# cover requires 206 responses. Canonical docs use a different origin.
cover_traffic_enabled = false
instructions_text = "Prices use credits at approximately $0.014 USDC per credit; tool descriptions include base costs and usage surcharges. socialfetch_linkedin_* uses v1; socialfetch_v2_linkedin_* uses v2. Preserve lookupStatus, partial results and provenance."

help_url = "https://www.socialfetch.dev/llms.txt"

[overrides.socialfetch_help]
description = "Read Social Fetch's API guide. API-key setup and monitor/webhook workflows describe another product; use exposed tools. Fetched on demand and cached for this process."

# Convert structured credit costs into USDC estimates in each tool description.
[credit_pricing]
credit_cost_key = "x-socialfetch-pricing"
usdc_per_credit = "0.014"
