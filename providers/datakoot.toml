description = "Public-data intelligence across security, software, filings, economics, weather and domains."
# Datakoot public-data and Koot synthesis tools; /api is a naming anchor.
spec = "https://x402.datakoot.com/openapi.json"
name = "Datakoot"
base_url = "https://x402.datakoot.com"
prefix = "datakoot"
include = ["/api", ""]
pricing_key = "x-payment-info"
read_timeout_seconds = 90
# x402.datakoot.com/llms.txt returns 404; the vendor guide is hosted on the apex domain.
help_url = "https://datakoot.com/llms.txt"
instructions_text = "Geocode, weather, elevation and brief_place cover US locations only. Per-operation price metadata differs from the guide summary; displayed prices remain estimates."

[overrides.datakoot_help]
description = "Read Datakoot's catalog and usage guide. Hosted MCP and free subdomain setup does not apply here."

[overrides.datakoot_epss_score.params]
cve_id = "A single CVE ID (e.g. CVE-2024-3094). Pass either cve_id or cve_ids (at least one is required)."
cve_ids = "Multiple CVE IDs (array or comma-separated string). Pass either cve_ids or cve_id (at least one is required)."

[overrides.datakoot_audit_dependencies.params]
manifest = "Raw manifest file content (package.json, requirements.txt, Cargo.toml, go.mod, or Gemfile.lock). Pass either manifest or dependencies (at least one is required)."
dependencies = "Explicit dependency map or array when not passing a raw manifest. Pass either dependencies or manifest (at least one is required)."

[overrides.datakoot_brief_stack.params]
packages = "Up to 25 dependency specifiers (e.g. ['lodash@4.17.21', 'express@4.19.2']). Pass either packages or manifest (at least one is required)."
manifest = "Raw package.json, requirements.txt, Cargo.toml, or go.mod content. Pass either manifest or packages (at least one is required)."

