description = "People Data Labs person and company data lookup and enrichment."
# Reusable Rust provider settings. Paths are relative to this file.
spec = "https://stablepeopledata.dev/openapi.json"
name = "People Data Labs"
base_url = "https://stablepeopledata.dev"
prefix = "pdl"
include = ["/api/pdl", ""]
pricing_key = "x-payment-info"
additional_properties = false

[overrides]

[overrides.pdl_person_enrich]
description = "People Data Labs person enrichment. $0.28 per match, free on no match. Returns demographics, work history, education, contact info, social profiles, skills. Provide at least one identifier: pdl_id, email, phone, profile URL (e.g. LinkedIn), name parts, or company/school + location."

[overrides.pdl_person_enrich.params]
min_likelihood = "Minimum confidence score 1-10 (default 2). Higher = fewer, better matches."

[overrides.pdl_company_enrich]
description = "People Data Labs company enrichment. $0.10 per match, free on no match. Returns firmographics, industry codes, funding, social profiles. Provide at least one identifier: pdl_id (or LinkedIn slug), name, website domain, ticker, profile URL, or HQ location."

[overrides.pdl_company_enrich.params]
min_likelihood = "Minimum confidence score 1-10 (default 2). Higher = fewer, better matches."

[overrides.pdl_person_search]
description = "Search People Data Labs person records via Elasticsearch DSL or SQL. $0.28 x size (max $28); free when the result set is empty. Recommended size 1-5. Paginate with the returned scroll_token. dataset picks record sources (resume, email, phone, mobile_phone, street_address, consumer_social, developer, all)."

[overrides.pdl_person_search.params]
size = "Batch size 1-100 (default 1). Price scales with size."

[overrides.pdl_company_search]
description = "Search People Data Labs company records via Elasticsearch DSL or SQL. $0.10 x size (max $10); free when the result set is empty. Paginate with the returned scroll_token."

[overrides.pdl_company_search.params]
size = "Batch size 1-100 (default 1). Price scales with size."

# Unsigned Tor probes verified HTTP/2 identity-encoded byte ranges at offsets 0 and 1024.
# Use the static resource instead of the range-ignoring catalog; keep default cover budgets.
[cover_traffic]
url = "https://stablepeopledata.dev/"
volume_mode = "extra_body"
concurrency = 1
max_requests_per_episode = 8
max_cover_body_bytes_per_episode = 16384
max_episode_ms = 10000
qualification_range_bytes = 1024
max_resource_bytes = 16777216

[cover_traffic.volume]
distribution = "log_normal"
median_bytes = 8192
sigma = 0.65
min_bytes = 4096
max_bytes = 16384

[cover_traffic.ranges]
distribution = "uniform"
min_bytes = 1024
max_bytes = 4096

[cover_traffic.start_delay]
distribution = "uniform"
min_ms = 0
max_ms = 100

[cover_traffic.request_gap]
distribution = "weibull"
scale_ms = 100.0
shape = 0.8
min_ms = 50
max_ms = 250

[cover_traffic.tail]
distribution = "uniform"
min_ms = 1000
max_ms = 3000
