# Reusable Rust provider settings. Paths are relative to this file.
spec = "https://kronossignals.com/api/openapi.json"
name = "Kronos Crypto Data"
base_url = "https://kronossignals.com"
prefix = "kronos"
include = ["/api/v1"]
instructions_text = "Kronos pay-per-call crypto market data (x402 USDC on Base; most calls $0.02-$0.10 — each tool's description states its price). {asset} paths take any of the 16 spot assets BTC/ETH/SOL/BNB/XRP/DOGE/ADA/AVAX/LINK/DOT/LTC/TRX/BCH/ATOM/NEAR/APT; perp markets also cover HYPE (derivatives only). kronos_track_record is free — audit the served model's live accuracy there before paying for forecasts. All output is informational only, not financial advice."

help_url = "https://kronossignals.com/llms.txt"

[overrides]

[overrides.kronos_track_record]
description = "Free — no payment required. Verifiable forecast-accuracy summary so an agent can audit the model before paying: overall hit_rate, resolved count, per-asset breakdown (BTC/ETH/SOL), Brier score, and the last 20 resolved forecasts as row-level audit data. Full paginated history via kronos_forecast_ledger ($0.02/call)."

[overrides.kronos_help]
description = "Read Kronos's API guide, asset coverage, signal interpretation and pricing. Fetched on demand and cached for this process. Follow the selected tool schemas; guide examples may describe a broader catalog."
