description = "Crypto spot and derivatives market data, forecasts and public model track records."
reliability_tags = ["slow_pricing", "intermittent_catalog_connection", "intermittent_help_connection"]
reliability_note = "Historical unsigned pricing probes encountered long response waits; slow_pricing refers to that removed stage. Tor causation is not established."

# Reusable Rust provider settings. Paths are relative to this file.
spec = "https://kronossignals.com/api/openapi.json"
name = "Kronos Crypto Data"
base_url = "https://kronossignals.com"
prefix = "kronos"
include = ["/api/v1", ""]
instructions_text = "Asset paths support BTC/ETH/SOL/BNB/XRP/DOGE/ADA/AVAX/LINK/DOT/LTC/TRX/BCH/ATOM/NEAR/APT; HYPE is derivatives-only. Use the free kronos_track_record to inspect served-model accuracy before forecasts."

help_url = "https://kronossignals.com/llms.txt"

[overrides]

[overrides.kronos_track_record]
description = "Free. Forecast-accuracy summary: hit_rate, resolved count, per-asset breakdown, Brier score and the last 20 resolved forecasts. Use kronos_forecast_ledger for paginated history ($0.02/call)."

[overrides.kronos_help]
description = "Read Kronos's API guide, asset coverage, signal interpretation and pricing. Guide examples may cover more tools; follow exposed schemas. Fetched on demand and cached for this process."
