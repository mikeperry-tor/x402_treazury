description = "Strait of Hormuz shipping, oil markets, vessel activity, sanctions and crisis indicators."
# Reusable Rust provider settings. Paths are relative to this file.
spec = "openapi.json"
name = "Straits.live Hormuz monitor"
base_url = "https://straits.live"
prefix = "straits"
include = ["/api/premium", "/api/v1", "/api", ""]
additional_properties = false
instructions_text = "Free JSON routes allow 60 requests/minute and 1,000/day per IP; respect other published format quotas. Prefer status or snapshot for polling. hormuz-snapshot and cape-snapshot are historical feeds frozen on 2026-08-28. With both tiers selected, vessels_get is the paid manifest and vessels_get_2 the free count summary; either alone is named vessels. CSV, RSS and HTML return text."
help_url = "https://straits.live/llms.txt"

[overrides]

[overrides.straits_index]
description = "Read the two 0-100 Hormuz Index composites: Crisis Pressure describes current conditions; Escalation Forecast combines prediction-market odds and the Brent-WTI spread without a fixed horizon. Returns bands, component breakdowns and history; recomputed every 10 minutes."
pricing_description = "Free — no payment required."

[overrides.straits_ais_gaps]
description = "Count of tankers that were broadcasting in the chokepoint core and went silent for 3-24 hours, plus the 7-day baseline. Computed every 30 minutes. Per-vessel dark-fleet identities are premium data."
pricing_description = "Free — no payment required."

[overrides.straits_briefs]
description = "JSON archive of every daily brief: 3-6 bullets, a short summary, the day's Brent price plus 24-hour delta, and the day's transit count, keyed by UTC date. Rewritten every few hours."
pricing_description = "Free — no payment required."

[overrides.straits_carriers]
description = "Read carrier Hormuz posture, trapped vessels/capacity and surcharges where stated in a carrier notice. surchargeUnit can be per container or per TEU; amounts are null when unreported. Five stopped carriers with advisory dates within 60 days drive the dashboard closure verdict. Hand-curated weekly."
pricing_description = "Free — no payment required."

[overrides.straits_chokepoints]
description = "Side-by-side daily counts for Hormuz, Bab el-Mandeb, Suez, the Cape of Good Hope, and Malacca (IMF PortWatch), sorted Hormuz first then by nTotal descending."
pricing_description = "Free — no payment required."

[overrides.straits_cushing]
description = "Cushing, Oklahoma WTI-delivery-hub inventories from the EIA weekly report - tracks the North-American crude balance independently of the Gulf-Coast / SPR picture; pairs with the Brent-WTI spread. Re-fetched daily 11:30 ET."
pricing_description = "Free — no payment required."

[overrides.straits_events]
description = "Read a source-cited timeline of strikes, ship incidents, closures and negotiations. Combines news-wire and RSS pulls every 15 minutes with hand-curated events; GDELT supplements the feed. count is headline rows; stories groups reports of the same incident."
pricing_description = "Free — no payment required."

[overrides.straits_gas]
description = "Per-state regular-grade averages plus a national mean across the 50 states plus DC (AAA). Refreshed hourly; upstream publishes daily."
pricing_description = "Free — no payment required."

[overrides.straits_insurance]
description = "Multiple over the peace-baseline VLCC premium, per-voyage cost in USD from peacetime baseline to current crisis high, and the P&I clubs / war-risk underwriters that have withdrawn cover, imposed quotas, or refused renewals. Hand-curated; timestamp refreshed weekly."
pricing_description = "Free — no payment required."

[overrides.straits_iran_rate]
description = "Open-market USD/IRR sell/buy rates in Toman (1 Toman = 10 Rial) and Rial, plus 24-hour and 7-day percentage deltas off the midRial - a proxy for civilian-side financial stress inside Iran. Refreshed hourly."
pricing_description = "Free — no payment required."

[overrides.straits_jwc]
description = "Marine war-risk high-risk areas from the Lloyd's Joint War Committee circular, plus a flag for whether the latest revision mentions the Arabian Gulf. Drives war-risk premium loads at most London-market underwriters. Re-checked every 6 hours."
pricing_description = "Free — no payment required."

[overrides.straits_markets]
description = "Read Hormuz, Iran-conflict and oil-shock odds from Kalshi, Polymarket and Manifold. Returns up to 50 matching rows; preserve total/truncated, market dates and sources. Rows flag index exclusions and incomplete Kalshi ladders."
pricing_description = "Free — no payment required."

[overrides.straits_oil]
description = "Read stored Brent and WTI futures observations. Points are irregularly spaced; use since for a time window. latest can switch to an EIA dated spot close when futures are stale over two hours; inspect latest.sourceKind and latest.observedAt. Source feed every ten minutes; edge cache five minutes."
pricing_description = "Free — no payment required."

[overrides.straits_pipelines]
description = "Petroline (Saudi Arabia to Yanbu) and Habshan-Fujairah (UAE to Gulf of Oman) - the main crude routes out of the Gulf without transiting Hormuz - with nameplate capacity in BPD and current utilisation. Hand-curated."
pricing_description = "Free — no payment required."

[overrides.straits_ports]
description = "Live vessel counts at Fujairah, Sohar, Bandar Abbas, and Jebel Ali from AIS positions inside a 10-18 km radius per port, by status (anchored, transiting) and vessel type. Computed every 30 minutes."
pricing_description = "Free — no payment required."

[overrides.straits_sanctioned_vessels]
description = "Count of vessels visible on AIS in the Persian Gulf window whose identity matches an OFAC SDN entry (IMO / normalised-name join; false positives possible). Cross-join every 15 minutes; per-vessel detail is premium data."
pricing_description = "Free — no payment required."

[overrides.straits_since]
description = "Compare state with ISO anchor at. material triggers on 24 hours elapsed, a 1% Brent move, a new event/carrier advisory, or a 30-hull transit/stranded delta; smaller hull deltas are null. Anchors under six hours or over 90 days return material=false without deltas. For anchors older than 72 hours, event counts are minima. Cached up to 60 seconds."
pricing_description = "Free — no payment required."

[overrides.straits_spr]
description = "SPR stocks from the EIA Weekly Petroleum Status Report with the 4-week change so spike-vs-baseline reads correctly. Re-fetched daily 11:00 ET."
pricing_description = "Free — no payment required."

[overrides.straits_stranded]
description = "Anchored-vessel count inside the Persian Gulf bounding box, hourly buckets written every 30 minutes. Powers the homepage sparkline."
pricing_description = "Free — no payment required."

[overrides.straits_tick]
description = "Read a compact state tick with Brent, transit/stranded counts and verifiedAt. Recomputed at most once every 120 seconds; edge-cached for 120 seconds. Brent can be an EIA dated spot close when futures are stale over two hours; inspect oil.sourceKind and oil.observedAt."
pricing_description = "Free — no payment required."

[overrides.straits_trade_impact]
description = "EIA/IEA shares of global seaborne oil and LNG transiting the strait, a curated daily economic-cost estimate, the most-affected importing economies, and extra Cape-reroute voyage days. Hand-curated; refreshed weekly."
pricing_description = "Free — no payment required."

[overrides.straits_transits]
description = "The dashboard's authoritative daily transit count with per-type breakdown (tanker, cargo, container, dry bulk, general cargo, Ro-Ro), capacity in DWT, trailing 30-day baseline median, and the fixed pre-crisis baseline (2025-02-28 to 2026-02-27). nCargo is nContainer plus nDryBulk plus nGeneralCargo plus nRoro - summing all seven fields double-counts."
pricing_description = "Free — no payment required."

[overrides.straits_transits_by_type]
description = "Hourly cross-tab of vessels in transit by type (tanker, cargo, military, other); the military count is a floor - the response's methodology field explains how type is resolved."
pricing_description = "Free — no payment required."

[overrides.straits_history_feed]
description = "Read a historical series selected by feed. index-5min retains its wire name; current ticks are ten minutes apart and older pages can contain five-minute ticks; use days up to 7 and response nextBefore as before to page older ticks. Transit history is daily; stranded and AIS-gap series contain hourly buckets with gaps. Preserve response resolution and coverage."
pricing_description = "Cost: ~$0.01/call [spec]. Invalid before values return 400 without charge."

[overrides.straits_history_feed.params]
feed = "Historical series to retrieve. index-5min returns the original index tick history; other feeds use their own published daily or hourly resolution."
days = "Index history window in days; defaults to seven. Use before to retrieve earlier pages."
before = "Exclusive ISO date or timestamp ending an index-history page; omit for the latest page, then pass response nextBefore to continue."

[overrides.straits_export]
description = "Download selected historical feeds as JSON or multi-section CSV. stranded and ais-gaps retain up to a year; transits retains full history. Index ticks cover only the latest seven days, with older daily aggregates; use the history tool and before for older tick-level data."
pricing_description = "Cost: ~$0.25/call [spec]."

[overrides.straits_risk_premium]
description = "Read a modeled war-risk transit insurance multiple with drivers, confidence and a separately labeled static insurance reference. Recomputed every ten minutes, but its weekly IMF throughput input can lag by more than a week. Preserve input dates and model/source distinctions."
pricing_description = "Cost: ~$0.05/call [spec]."

[pricing]
source = "catalog"
format = "payment-info"
unit = "call"
usd_as_usdc = true
