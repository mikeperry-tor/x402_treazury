description = "Synchronous job-board and social-media scraping."
# Scrapers plus future supported schema arrivals; exclude the documented SIWX lifecycle paths.
spec = "https://hirescrape.com/openapi.json"
name = "HireScrape"
base_url = "https://hirescrape.com"
prefix = "hirescrape"
exclude = ["/api/skills/search", "/api/skills/runs", "/api/snapshots", "/api/reports", "/api/scraper-requests"]
include = ["/api/tools", ""]
pricing_key = "x-payment-info"
read_timeout_seconds = 120
help_url = "https://hirescrape.com/llms.txt"
instructions_text = "Keep total requested records well below 200 and avoid async discovery modes: snapshots require unsupported same-wallet SIWX authentication and cookies. Follow tool schemas for mode and limit/maxResults rather than legacy names in vendor guides."

[overrides.hirescrape_help]
description = "Read HireScrape's guide. Legacy modes and parameter names may differ from exposed schemas. Snapshot polling requires unsupported SIWX authentication; keep requests synchronous."

[overrides.hirescrape_jobs.params]
maxResults = "Max results per site (1-100, default 20). Total requested records are len(sites) * maxResults. Keep that total well below 200 to reduce async handoffs; snapshot retrieval requires unsupported SIWX authentication."
sites = "Job boards to query (defaults to all 8 boards when omitted). Select only needed boards to control the total requested records."

[overrides.hirescrape_instagram.params]
mode = "Use one of the schema enum values (profile, basic_profile, user_posts, post, transcript, search_reels, post_comments, user_reels, highlights, highlight_detail, song_reels, embed); ignore legacy mode names in vendor prose."
limit = "Max records to collect (default 20). Keep well below 200 to reduce async handoffs; small requests do not guarantee inline results."

[overrides.hirescrape_linkedin.params]
mode = "Use one of the schema enum values (profile, company, company_posts, post); ignore legacy person/job search mode names in vendor prose that are absent from the request schema."
limit = "Max items to collect (default 20). Keep well below 200 to reduce async handoffs; small requests do not guarantee inline results."

[overrides.hirescrape_tiktok]
description = "Read TikTok profiles, videos, comments and transcripts, or discover popular songs, creators, videos and hashtags with trend charts. Snapshot results cannot be retrieved through this integration."

[overrides.hirescrape_tiktok.params]
mode = "Use schema enum values, not legacy names from the guide. Some modes may return snapshots that cannot be retrieved here."
limit = "Max records to collect (default 20). Keep well below 200 to reduce async handoffs; small requests do not guarantee inline results."

[overrides.hirescrape_tiktok_shop.params]
mode = "Use one of the schema enum values (search, products, product, reviews, showcase); ignore legacy mode names in vendor prose."
limit = "Max items to collect (default 20). Keep below 200 to reduce async handoffs; small requests do not guarantee inline results."

[overrides.hirescrape_youtube.params]
mode = "Use schema enum values. The guide marks videos_by_*, channels_by_keyword and comments as async; their snapshots require unsupported SIWX retrieval. Video/channel modes may also hand off, especially for large requests."
limit = "Max items to collect (default 20). Keep well below 200 to reduce async handoffs; small counts do not make documented async modes synchronous."
num_of_posts = "Max records to collect. Set a small explicit count well below 200; avoid 0 (all records). Small counts do not make documented async modes synchronous."

