description = "Company registries, government and court records, LinkedIn company facts, business reviews, healthcare-provider directories and ACA insurance plans from SiteCheck."
# Help and catalog ignore unsigned byte ranges; disable optional cover.
cover_traffic_enabled = false
spec = "https://api.companyrecords-api.workers.dev/openapi.json"
name = "SiteCheck Company Records"
