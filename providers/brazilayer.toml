description = "Brazilian CNPJ company registries, public procurement, sanctions and economic data."
# Reusable Rust provider settings. Paths are relative to this file.
spec = "https://api.brazilayer.com/openapi.json"
name = "Brazilayer — Brazilian Company Data (CNPJ)"
base_url = "https://api.brazilayer.com"
prefix = "brazilayer"
include = ["/v1", ""]
instructions_text = "Validate CNPJ check digits with the free ferramentas tool before paid lookup. Response keys use Portuguese legal terms. Search totals may be the string \"10000+\". The *_amostra tools provide free response samples."

help_url = "https://api.brazilayer.com/llms.txt"

[overrides]

[overrides.brazilayer_health]
description = "Service status and data reference month."
pricing_description = "Free."

[overrides.brazilayer_ferramentas]
description = "Tools index."
pricing_description = "Free."

[overrides.brazilayer_ferramentas_cnpj_valor]
description = "Check digits, normalized 14-digit form, punctuated form, 8-digit root (economic group) and headquarters/branch flag. Pure arithmetic — no database lookup. Use it before paying: an invalid CNPJ never resolves in any paid endpoint."
pricing_description = "Free — no payment required."

[overrides.brazilayer_ferramentas_cpf_valor]
description = "Check-digit validation only. Pure arithmetic: nothing is stored or looked up, and the response never echoes the full number — only the masked form."
pricing_description = "Free — no payment required."

[overrides.brazilayer_cnpj_amostra]
description = "Full sample (format of /v1/empresa/{cnpj}/completo) for one fixed CNPJ"
pricing_description = "Free."

[overrides.brazilayer_integridade_amostra]
description = "Sample screening response (real sanctioned company)"
pricing_description = "Free."

[overrides.brazilayer_licitacoes_amostra]
description = "Sample of the supplier-contracts response"
pricing_description = "Free."

[overrides.brazilayer_bcb_amostra]
description = "Sample of the Central Bank check response"
pricing_description = "Free."

[overrides.brazilayer_empresa_amostra]
description = "Sample of the enriched profile (a sanctioned company with public contracts)"
pricing_description = "Free."

[overrides.brazilayer_mercado_amostra]
description = "Sample of the markets dataset (news + indicators)"
pricing_description = "Free."

[overrides.brazilayer_pacotes_amostra]
description = "List of the packs, what each contains and what it saves"
pricing_description = "Free."

[overrides.brazilayer_commodities_amostra]
description = "Sample of the commodity signals dataset"
pricing_description = "Free."

[overrides.brazilayer_fundos_amostra]
description = "Sample of the fund industry dataset"
pricing_description = "Free."

[overrides.brazilayer_tributos_amostra]
description = "Sample of the tax reform dataset"
pricing_description = "Free."

[overrides.brazilayer_cadeias_amostra]
description = "Sample of a full causal chain"
pricing_description = "Free."

[overrides.brazilayer_desmatamento_amostra]
description = "Sample of the deforestation dataset"
pricing_description = "Free."

[overrides.brazilayer_cnpj_busca]

[overrides.brazilayer_cnpj_busca.params]
nome = "Full-text on legal and trade names (Portuguese, accent-insensitive). Example: padaria."

[overrides.brazilayer_cnpj_socio_busca]

[overrides.brazilayer_cnpj_socio_busca.params]
nome = "Person or entity name (full-text, accent-insensitive); at least 3 characters."

[overrides.brazilayer_integridade_consulta_cnpj]
description = "Screens a Brazilian company against CEIS, CNEP, CEPIM, the slave-labor\nblacklist (MTE) and leniency agreements. Legal-entity records only.\nSources updated daily."
pricing_description = "Price: $0.01 per call (vendor summary)."

[overrides.brazilayer_help]
description = "Read Brazilayer's API guide, response conventions, coverage and pricing. Fetched on demand and cached for this process."

[pricing]
source = "https://api.brazilayer.com/.well-known/x402"
format = "x402-discovery"
