description = "Domain, DNS, IP and email intelligence, satellite data and developer utilities."
# Domain, DNS, IP, satellite and developer tools; recommendations do not restrict availability.
spec = "https://tools.ipintel.ai/openapi.json"
name = "IPIntel.ai"
base_url = "https://tools.ipintel.ai"
prefix = "ipintel"
recommended_tools = ["ipintel_dns_lookup", "ipintel_ip_lookup", "ipintel_domain_health", "ipintel_whois_lookup", "ipintel_help"]
pricing_key = "x-payment-info"
help_url = "https://tools.ipintel.ai/llms.txt"
instructions_text = "Domain availability is probabilistic; health scores summarize configuration, not legitimacy. Email validation does not prove reachability. Infrastructure signals do not prove ownership or location."

[overrides.ipintel_satellite]
description = "Retrieve satellite observations for lat/lon, optional radius_m, mode and date. Null date selects the latest suitable scene; fallback=true (default) may select a nearby date. Preserve scene timestamps, fulfillment status, warnings and Copernicus attribution. Image links remain metadata. Cost: ~$0.09/call [spec]."

[overrides.ipintel_jwt_decode]
description = "Decode JWT header, claims and timestamp hints without verifying the signature. Send only tokens suitable for vendor disclosure. Cost: ~$0.001/call [spec]."

[overrides.ipintel_http_latency]
description = "Measure HTTP latency and status for url from the handling Cloudflare Worker edge. Defaults to HEAD; GET is also supported. Returns response time and redirect details. This is not ICMP ping or the caller’s network latency. Cost: ~$0.001/call [spec]."
