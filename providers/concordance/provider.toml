description = "Cited cross-source research across filings, economics, news, science and time-series data."

# Reusable Rust provider settings. Paths are relative to this file.
spec = "openapi.json"
name = "Concordance"
base_url = "https://concordancehq.duckdns.org"
prefix = "concordance"
include = ["/tools", ""]
additional_properties = false
instructions_text = "Company briefs may contain partial sections; corroboration counts distinct sources, not independently verified truth."
help_url = "https://concordancehq.duckdns.org/llms.txt"

[overrides]

[overrides.concordance_search]
description = "Search aggregated news, filings, court opinions, papers, government records and developer discussions. Results include source, category, title, content, URL and publication time. Optional source/category/since filters; limit 1–100 (default 20)."
pricing_description = "$0.01/call."

[overrides.concordance_series]
description = "Tabular time-series lookup by source and series_id: economic indicators (FRED, World Bank, UN Comtrade), crypto TVL (DefiLlama), weather (open_meteo), and stock quotes (finnhub, twelvedata, and polygon). Optional start and end date range; returns [{observed_at, value}] points."
pricing_description = "$0.01 per call."

[overrides.concordance_series.params]
source = "Catalog source slug: arxiv, core, courtlistener, defillama, finnhub, gdelt, govinfo, hackernews, open_meteo, polygon, regulations_gov, sec_edgar, stackexchange, twelvedata, un_comtrade, wikipedia, world_bank, fred."
series_id = "Vendor series ID, such as GDP for FRED or US-NY.GDP.MKTP.CD for the World Bank. Check the source catalog for current IDs."

[overrides.concordance_company_brief]
description = "Combine market quotes, SEC filings and news, academic, legal or developer mentions for a company. Sections can be missing; inspect coverage before drawing conclusions."

[overrides.concordance_company_brief.params]
company = "Ticker (AAPL) or company name (Apple). Coverage is a bounded vendor watchlist."

[overrides.concordance_digest]
description = "Aggregate cited search hits across source categories for a topic. Returns structured category groups, not a generated summary."

[overrides.concordance_corroboration]
description = "Find matches for a claim grouped by source. Source counts help trace coverage but do not establish independent verification or truth."

[overrides.concordance_timeline]
description = "Track topic coverage chronologically across aggregated sources, oldest first."

[pricing]
source = "catalog"
format = "payment-info"
unit = "call"
usd_as_usdc = true
