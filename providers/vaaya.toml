instructions_text = "Vaaya synchronous research: cited OneSearch, web search/scrape, public filings/courts/patents, company/funding intelligence and reviews. Treazury handles x402 USDC on Base without a Vaaya account or API key; MPP-only, async jobs, uploads, outreach, account state and payment forwarding are outside this selected toolset. Help describes a much broader account service. Send arguments as JSON body fields and preserve ok/data/charged_cents, partial results, source URLs and timestamps. Resolve legal entities/CIKs before combining EDGAR results; no autocomplete match does not prove an entity never registered. CourtListener RECAP coverage is incomplete; no hits are not proof of no litigation. Fundable company requires one of id/domain/linkedin/crunchbase; company-search requires one of name/domain/linkedin/crunchbase. Verify returned company identity: the vendor documents sampled entity mismatches and stale aggregate funding totals. TheirStack jobs requires a date or company condition, and technographics requires a company identifier even though schema required lists omit them; follow tool descriptions. TheirStack companies is advertised at $0.60, above the example company listener's $0.50 cap. All listed prices are estimates; live challenges and the configured payment cap govern signing. Treazury does not automatically download hosted assets or replay uncertain paid submissions."
