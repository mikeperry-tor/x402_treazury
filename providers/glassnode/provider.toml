description = "On-chain crypto analytics with metric discovery, parameter metadata and time-series data."
# Reusable Rust provider settings. Paths are relative to this file.
spec = "openapi.json"
name = "Glassnode x402"
base_url = "https://x402.glassnode.com"
prefix = "glassnode"
include = ["/v1", ""]
instructions_text = "Discover metric paths with glassnode_metadata_metrics, inspect allowed parameters with glassnode_metadata_metric, then fetch with glassnode_metrics_category_metric. category and metric are the first two path segments; a is the asset symbol. Time-series fields t, v and optional o mean Unix timestamp, value and multi-value object."
help_url = "https://docs.glassnode.com/basic-api/x402.md"
