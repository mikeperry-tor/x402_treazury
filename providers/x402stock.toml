# Reusable Rust provider settings. Paths are relative to this file.
spec = "https://x402stock.xyz/openapi.json"
name = "x402stock"
base_url = "https://x402stock.xyz"
prefix = "x402stock"
include = ["/api/v1"]
pricing_key = "x-payment-info"
instructions_text = "Pay-per-call market and economic data: US stocks/ETFs/options, forex, crypto and on-chain perps, energy commodities, macro (Fed, CPI, jobs, GDP, Treasury), SEC filings, congressional trades, and sentiment. Endpoints live under /api/v1 and return {ticker, data, source, as_of}. Path placeholders like {ticker} go in the URL path (uppercase symbols), never as query parameters; resolve unknown symbols first via /api/v1/tickers?search=. Unpaid requests to paid endpoints answer HTTP 402 with the quote in response headers; pay the quoted USDC amount and retry the same request."
help_url = "https://x402stock.xyz/llms.txt"
exclude = ["/api/v1/fed-funds", "/api/v1/inflation", "/api/v1/pce", "/api/v1/labor-market", "/api/v1/gdp", "/api/v1/treasury-yields", "/api/v1/perps/{coin}", "/api/v1/perps/funding/{coin}", "/api/v1/perps/orderbook/{coin}", "/api/v1/short-interest/{ticker}", "/api/v1/short-volume/{ticker}", "/api/v1/fails-to-deliver/{ticker}", "/api/v1/filings/{ticker}", "/api/v1/insider-trades/{ticker}", "/api/v1/material-events/{ticker}", "/api/v1/form-3/{ticker}", "/api/v1/gainers", "/api/v1/losers", "/api/v1/market-status", "/api/v1/technicals/{ticker}", "/api/v1/related/{ticker}", "/api/v1/ticker/{ticker}", "/api/v1/events/{ticker}", "/api/v1/indicators", "/api/v1/trending/4chan", "/api/v1/trending/reddit", "/api/v1/snapshot/{ticker}", "/api/v1/prev-close/{ticker}", "/api/v1/crypto/{pair}/prev-close", "/api/v1/forex/{pair}/prev-close", "/api/v1/hip3/{dex}/{market}", "/api/v1/spot/{token}", "/api/v1/private-stocks/{symbol}", "/api/v1/xstocks/{ticker}", "/api/v1/screener/smart", "/api/v1/score/insider/{ticker}", "/api/v1/score/squeeze/{ticker}", "/api/v1/full-market-snapshot", "/api/v1/exchanges", "/api/v1/conditions", "/api/v1/ticker-types", "/api/v1/market-holidays", "/api/v1/backtest/{ticker}", "/api/v1/report/{ticker}"]
