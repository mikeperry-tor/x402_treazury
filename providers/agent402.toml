instructions_text = "Agent402 paid tools using x402 USDC on Base. This provider defaults to web tools; operators can select other reviewed subsets with exact lowercase tags such as data, crypto, network, text, math or llm. agent402_help loads the full vendor guide only when called; it also describes excluded wallet-keyed memory/account tools, delegated workflows and binary/base64 media output. PoW, MPP, cards, credits and the vendor MCP connector are separate client options, not Treazure setup steps. Use completed JSON responses: omit stream or set false. For model gateways set a small output-token budget; quoted ceilings and actual-usage billing differ. Managed wallets support exact EIP-3009 payments; upto is not enabled by selecting a tag. Vendor price estimates never override the payment cap or live challenge. Some reports exceed the default cap or need a longer configured timeout. Preserve vendor truncated/partial markers. Missing receipts after a timeout do not prove that nothing was charged; do not blindly repeat paid requests."

[overrides.agent402_help]
description = "Read Agent402's unified catalog and usage guide, fetched on demand and cached for this process. The document is large and covers more tools and payment methods than this selected catalog. Treazure handles x402 payments; vendor PoW/MPP/card setup and retry claims are not additional capabilities or payment guarantees here. Any configured document limit is reported explicitly."

