description = "Web search, answers, page extraction, document conversion and supported model utilities."
# Full supported catalog; recommendations select a compact web-research view only on opt-in.
spec = "https://agent402.tools/openapi.json"
name = "Agent402"
base_url = "https://agent402.tools"
prefix = "agent402"
recommended_tools = ["agent402_search", "agent402_answer", "agent402_search_news", "agent402_extract", "agent402_render", "agent402_pdf_to_markdown", "agent402_image_ocr", "agent402_help"]
exclude_operations = ["POST /api/feedback"]
exclude = ["/api/memory", "/api/my-usage", "/api/receipts", "/api/attest", "/api/testnet-fund", "/api/decide/execute", "/api/route/execute", "/api/route/execute-max", "/api/route/execute-plus", "/api/route/execute-pro", "/v1/audio/speech", "/v1/audio/transcriptions", "/v1/pro/audio/transcriptions"]
include = ["/api", "/v1", ""]
pricing_key = "x-payment-info"
read_timeout_seconds = 90
help_url = "https://agent402.tools/llms.txt"
instructions_text = "Agent402 supported tools use x402 USDC on Base. Recommendations offer a compact web-research view only when explicitly selected; exact lowercase vendor tags can narrow sources. Preserve partial/truncated and per-step failure markers. Omit stream or set false. PNG/JPEG/WebP binary output becomes MCP images; choose png or jpeg for resize, convert and thumbnail, never bmp. JSON containing base64 PDF/audio/video/image data remains JSON text unless an existing explicit image mapping applies; no automatic asset fetching or decoding is added. Raw speech and multipart transcription upload routes, wallet-owned memory/history/attestation/feedback, actual funding and delegated execution remain excluded. onramp_link only returns a human checkout link and quote and does not fund a wallet. Some gateways/reports take time or exceed ordinary payment caps; published estimates and model token hints never override the live challenge or configured authority. Do not set Prefer: respond-async or promise job polling. MPP, card, credits, PoW and hosted-MCP setup are other clients, not extra Treazury capabilities. Missing receipts do not prove no charge; never automatically replay uncertain signed payments."

[overrides.agent402_help]
description = "Read Agent402's unified catalog and usage guide, fetched on demand and cached for this process. The document is large and covers more tools and payment methods than this selected catalog. Treazury handles x402 payments; vendor PoW/MPP/card setup and retry claims are not additional capabilities or payment guarantees here. Any configured document limit is reported explicitly."

