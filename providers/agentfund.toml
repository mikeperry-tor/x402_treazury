description = "US economic indicators, SEC filings, on-chain public data and deterministic text utilities."
# Catalog/help and tested same-origin static paths did not support unsigned byte ranges.
# Disable optional cover; ordinary API requests retain their configured network policy.
cover_traffic_enabled = false

# Reusable Rust provider settings. Paths are relative to this file.
spec = "https://x402.agentfund.net/openapi.json"
name = "AgentFund US Economic, SEC & On-Chain Data"
prefix = "agentfund"
include = ["/x402", ""]
additional_properties = false
instructions_text = "US economic indicators, SEC filings, on-chain data and text utilities. Preserve source publication lags and revision policies. Vendor claims failed upstream requests are not billed; a failed call does not prove nonpayment."

[pricing]
source = "catalog"
format = "payment-info"
unit = "call"
usd_as_usdc = true

