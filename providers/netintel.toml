help_url = "https://netintel.dev/llms.txt"
instructions_text = "NetIntel network, DNS, TLS, domain, IP, email, crypto, web-search, extraction and model tools via x402 USDC on Base. Where the vendor spec exposes both GET and POST on the same path, this catalog selects the canonical POST route so sensitive fields (such as passwords and JWTs) and array parameters travel in the JSON body and tool names stay unsuffixed. Duplicate /api/v1/* aliases of /v1/chat/completions and /v1/embeddings are omitted. netintel_ai_image_generate extracts its base64 PNG data URI as an MCP image attachment alongside the JSON metadata. Published prices ($0.001–$0.65) are vendor estimates; the live 402 challenge and configured spend cap remain authoritative."

[overrides.netintel_help]
description = "Read NetIntel's endpoint index and usage guide, fetched on demand and cached for this process. Its header summary ($0.005–$0.100 and legacy X-PAYMENT wording) lags the full catalog ($0.001–$0.65 over x402 v2); Treazury handles Base USDC payment automatically."

[response_mappings."POST /ai-image/generate"]
images = [{ pointer = "/image_url", encoding = "data_uri" }]

