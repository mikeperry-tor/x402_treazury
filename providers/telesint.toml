description = "Stateless Telegram, cyber-threat and open-source intelligence across actors, indicators and breaches."
# Stateless CTI and OSINT; wallet-owned watch state is incompatible with rotating payers.
spec = "https://telesint-api.onrender.com/openapi.json"
name = "TeleSINT"
base_url = "https://telesint-api.onrender.com"
prefix = "telesint"
recommended_tools = ["telesint_actor", "telesint_artifact", "telesint_asn", "telesint_breach", "telesint_c2", "telesint_claim_check", "telesint_darkweb", "telesint_feed", "telesint_intent", "telesint_ioc", "telesint_malware", "telesint_preparation", "telesint_ransomware", "telesint_search", "telesint_source", "telesint_target_mentions", "telesint_velocity", "telesint_vulnerability", "telesint_help"]
exclude = ["/watch"]
pricing_key = "x-payment-info"
probe_pricing = false
read_timeout_seconds = 90
# Use SKILL.md (advertised via x-skill-url in openapi.json) because /llms.txt is truncated mid-line at line 25.
help_url = "https://telesint-api.onrender.com/SKILL.md"
instructions_text = "TeleSINT cyber threat intelligence and conflict/geopolitical OSINT via x402 USDC on Base. Wallet-bound watchlist routes (/watch/*) are excluded because they tie watchlist ownership to the paying wallet address, which changes across managed wallet rotation. Always supply required scope parameters on telesint_preparation and telesint_velocity (at least one of organization, sector, country, actor, or vendor) and on telesint_claim_check (id or text): the upstream server returns HTTP 200 with a guidance/error JSON body when scope parameters are omitted, which would still consume a paid call. Use the parameter names and enum values declared in each tool's input schema rather than undocumented query fields in the vendor guide."

[overrides.telesint_help]
description = "Read TeleSINT's full Telegram CTI and OSINT SKILL.md reference guide (used instead of /llms.txt, which is truncated mid-line), fetched on demand and cached for this process. The guide also describes excluded wallet-bound /watch/* routes, free /status, and some query parameter names or enum spellings that differ from the OpenAPI schema; follow the exposed tools' input schemas."

[overrides.telesint_search]
description = "Cross-Category CTI Search — Pivot across all TeleSint Telegram CTI categories with a single query. Accepts keyword search plus filters: category, severity, sector, country, actor name, TTP, tag, confidence. Returns unified items[] across any category. Cost: ~$0.04/call [spec]."

[overrides.telesint_feed]
description = "Unified Threat Intelligence Feed — Full unified feed of all TeleSint Telegram CTI categories in one call. Sorted by timestamp descending. Useful for SIEM ingestion, threat dashboards, and monitoring agents that need the complete picture. Cost: ~$0.05/call [spec]."

[overrides.telesint_artifact]
description = "CTI Artifact Export — Export a TeleSint Telegram intel record as a Sigma detection rule, STIX 2.1 bundle, or structured analyst report. Requires the record id (from any endpoint's items[].id) and a format. All output is derived from real enriched fields — no synthetic data. Cost: ~$0.05/call [spec]."

[overrides.telesint_preparation]
description = "Adversary Preparation Assessment — Is someone preparing to attack this organisation, sector or country based on Telegram CTI signals? Five-stage ladder (motive, capability, infrastructure, recon, access) with gaps, Dempster-Shafer fusion of independent signal families (belief, plausibility, conflict), EWMA velocity per stage and a deterministic verdict escalate | watch | none. No LLM in the decision path. Pass at least one scope parameter (organization, sector, country, actor, or vendor) to avoid a paid HTTP 200 guidance error. Cost: ~$0.10/call [spec]."

[overrides.telesint_velocity.params]
organization = "Target organisation name. Pass at least one scope parameter (organization, sector, country, actor, or vendor) to avoid a paid HTTP 200 guidance error."

[overrides.telesint_claim_check.params]
id = "TeleSint record id. Pass either id or text (at least one is required to avoid a paid HTTP 200 guidance error)."
text = "Claim text, max 4000 chars. Pass either text or id (at least one is required to avoid a paid HTTP 200 guidance error)."

