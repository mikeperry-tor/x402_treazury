name: Native Windows

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

# Public repositories use standard free runners. A privacy change deliberately
# skips these jobs: private/paid execution requires separate operator authority.
jobs:
  build:
    if: ${{ github.event.repository.private == false }}
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Preserve repository bytes and long native paths
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify reviewed vendor sources before Rust installation
        run: ./scripts/windows-ci.ps1 -Stage Vendor
      - name: Install the repository Rust pin
        run: |
          $pin = (Select-String -Path rust-toolchain.toml -Pattern '^channel = "([^"]+)"$').Matches.Groups[1].Value
          if (-not $pin) { throw 'Missing pinned Rust toolchain' }
          rustup toolchain install $pin --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build ordinary executable and run CLI smoke tests
        run: ./scripts/windows-ci.ps1 -Stage Release

  checks:
    if: ${{ github.event.repository.private == false }}
    needs: build
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Preserve repository bytes and long native paths
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config --global core.longpaths true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the repository Rust pin
        run: |
          $pin = (Select-String -Path rust-toolchain.toml -Pattern '^channel = "([^"]+)"$').Matches.Groups[1].Value
          if (-not $pin) { throw 'Missing pinned Rust toolchain' }
          rustup toolchain install $pin --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate native compiler, tests and synthetic recovery
        run: ./scripts/windows-ci.ps1 -Stage Checks
