name: Treasury lifecycle diagnostics

on:
  workflow_dispatch:
  push:
    branches: [ci_coverage]
    paths:
      - '.github/workflows/treasury-lifecycle-diagnostics.yml'
      - 'scripts/diagnose-treasury-sync.py'
      - 'scripts/tests/test_treasury_sync_diagnostics.py'
      - 'Makefile'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  diagnose:
    name: Lifecycle progress at eight threads
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install pinned Rust and native debugger
        run: |
          rustup show active-toolchain
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gdb
          sudo sysctl -w kernel.yama.ptrace_scope=0
      - name: Verify native attach and record runner resources
        run: |
          mkdir -p target/ci-diagnostics/treasury-lifecycle
          {
            nproc
            free -m
            for resource in /sys/fs/cgroup/cpu.max /sys/fs/cgroup/memory.max; do
              if [[ -r "$resource" ]]; then
                printf '%s: ' "$resource"
                cat "$resource"
              fi
            done
          } > target/ci-diagnostics/treasury-lifecycle/runner.txt
          sleep 30 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          timeout --signal=KILL 10s gdb -q -nx -batch \
            -iex 'set auto-load off' -iex 'set debuginfod enabled off' \
            -ex 'set print frame-arguments none' -ex 'thread apply all bt' \
            -ex detach -p "$fixture_pid" \
            > target/ci-diagnostics/treasury-lifecycle/debugger-smoke.txt 2>&1
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-inputs-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'tools/protoc/Cargo.lock') }}
      - name: Compile the feature-enabled library test harness
        run: |
          git rev-parse HEAD > target/ci-diagnostics/treasury-lifecycle/revision.txt
          make test CARGO_ARGS='--features zcash-testutils --lib --no-run --message-format=json' \
            2> >(tee target/ci-diagnostics/treasury-lifecycle/build.stderr >&2) \
            | tee target/ci-diagnostics/treasury-lifecycle/build.jsonl
      - name: Run lifecycle tests with periodic capture
        run: |
          exec python3 scripts/diagnose-treasury-sync.py --lifecycle \
            target/ci-diagnostics/treasury-lifecycle/build.jsonl \
            target/ci-diagnostics/treasury-lifecycle
      - name: Upload lifecycle diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: treasury-lifecycle-diagnostics
          path: target/ci-diagnostics/treasury-lifecycle/
          if-no-files-found: ignore
