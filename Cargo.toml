[package]
name = "x402_treazury"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false
default-run = "x402_treazury"

[workspace]
members = [".", "vendor/pepper-sync"]
default-members = ["."]
resolver = "3"
# Only Pepper's private merge fixture needs dependency unit-test selection.
exclude = [
    "vendor/reqwest",
    "vendor/hyper",
    "vendor/h2",
]

# Keep file/line backtraces without full type and variable debug information.
# The test profile inherits these settings; release settings remain unchanged.
[profile.dev]
debug = "line-tables-only"

[[bin]]
name = "x402_treazury"
path = "src/main.rs"

[features]
# Explicit opt-in for synthetic-note proving tests; never needed by serving.
zcash-testutils = ["zingolib/testutils", "dep:orchard", "dep:zingo-status"]
zcash-regtest = ["zcash-testutils", "dep:zcash_local_net"]

[dependencies]
rand = "0.9"
rand10 = { package = "rand", version = "0.10" }
sapling-crypto = "0.9.0"
jubjub = "0.11.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
zcash_local_net = { git = "https://github.com/zingolabs/infrastructure.git", rev = "89cf104a2416144d1bbbae30aca02bec062d1492", optional = true }
orchard = { version = "0.16.0", default-features = false, features = ["circuit"], optional = true }
tempfile = "3"
rusqlite = { version = "0.38", features = ["bundled"] }
chacha20poly1305 = "0.10"
zeroize = "1"
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
httpdate = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
zingolib = { git = "https://github.com/zingolabs/zingolib", rev = "bfb0a2156819ea7f75a9b09b1724abfd06c8925e", default-features = false }
zip32 = { version = "0.3.0" }
zcash_client_backend = { version = "=0.25.0-pre.1", default-features = false }
zcash_primitives = { version = "=0.31.0-pre.1", default-features = false }
zcash_protocol = { version = "=0.11.0-pre.0" }
zcash_keys = { version = "=0.17.0-pre.1", default-features = false }
zingo-netutils = { git = "https://github.com/zingolabs/zingolib", rev = "bfb0a2156819ea7f75a9b09b1724abfd06c8925e", default-features = false }
zingo-status = { git = "https://github.com/zingolabs/zingolib", rev = "bfb0a2156819ea7f75a9b09b1724abfd06c8925e", optional = true }
pepper-sync = { git = "https://github.com/zingolabs/zingolib", rev = "bfb0a2156819ea7f75a9b09b1724abfd06c8925e" }
shardtree = { version = "0.8.0", default-features = false }
bip0039 = { version = "0.14" }
zcash_proofs = { version = "=0.31.0-pre.1" }
tonic = { version = "0.14", default-features = false }
tower = { version = "0.5", features = ["util"] }
tokio-stream = "0.1"
alloy-primitives = "1.5"
alloy-signer-local = "2.0"
anyhow = "1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
percent-encoding = "2"
regex = "1"
rustls = { version = "0.23", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "socks", "http2"] }
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
sha2 = "0.10"
http-body = "1"
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "client-proxy"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x402-chain-eip155 = { version = "=2.0.2", features = ["client", "telemetry"] }
x402-reqwest = "=2.0.2"
x402-types = "=2.0.2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
h2 = "0.4"
alloy-sol-types = "1.5"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

# Reviewed transport patches: see vendor/README.md.
[patch.crates-io]
reqwest = { path = "vendor/reqwest" }
h2 = { path = "vendor/h2" }
hyper = { path = "vendor/hyper" }

[[example]]
name = "quote_near"
path = "tools/diagnostics/quote_near.rs"

[patch."https://github.com/zingolabs/zingolib"]
pepper-sync = { path = "vendor/pepper-sync" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
sha2 = "0.10"

[[example]]
name = "live_integration"
path = "tests/live/live_integration.rs"

[[example]]
name = "snapshot_spec"
path = "tools/providers/snapshot_spec.rs"

[[example]]
name = "snapshot_agentutility"
path = "tools/providers/snapshot_agentutility.rs"

[[example]]
name = "diagnose_credit"
path = "tools/diagnostics/diagnose_credit.rs"

[[example]]
name = "provider_preflight"
path = "tests/live/provider_preflight.rs"
