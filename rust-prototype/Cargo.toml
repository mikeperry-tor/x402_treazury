[package]
name = "x402-mcp-prototype"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[features]
default = []
zcash = ["dep:zingolib", "dep:zip32", "dep:zcash_client_backend", "dep:zcash_primitives", "dep:zcash_protocol", "dep:zcash_keys", "dep:zingo-netutils", "dep:tonic"]

[dependencies]
tempfile = "3"
rusqlite = { version = "0.38", features = ["bundled"] }
chacha20poly1305 = "0.10"
zeroize = "1"
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"
zingolib = { git = "https://github.com/zingolabs/zingolib", rev = "c6381534f802b1022041beda4b01c106ad132329", default-features = false, optional = true }
zip32 = { version = "0.2.1", optional = true }
zcash_client_backend = { version = "0.24", default-features = false, optional = true }
zcash_primitives = { version = "0.30.1", default-features = false, optional = true }
zcash_protocol = { version = "0.10.6", optional = true }
zcash_keys = { version = "0.16.1", default-features = false, optional = true }
zingo-netutils = { git = "https://github.com/zingolabs/zingolib", rev = "c6381534f802b1022041beda4b01c106ad132329", default-features = false, optional = true }
tonic = { version = "0.14", default-features = false, optional = true }
alloy-primitives = "1.5"
alloy-signer-local = "2.0"
anyhow = "1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query"] }
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x402-chain-eip155 = { version = "=2.0.2", features = ["client", "telemetry"] }
x402-reqwest = "=2.0.2"
x402-types = "=2.0.2"

[dev-dependencies]
alloy-sol-types = "1.5"

# Experimental compatibility patch: see vendor/README.md.
[patch.crates-io]
lightwallet-protocol = { git = "https://github.com/zingolabs/lightwallet-protocol-rust", rev = "9bdfdc77eb283f2a3d26c27100cc2ac90148cd93" }
alloy-primitives = { path = "vendor/alloy-primitives" }
alloy-sol-macro-expander = { path = "vendor/alloy-sol-macro-expander" }
