# Reserve sizes are funding preferences; the explicit group cap governs every wallet.
# Initial active funding uses small; refill vacant slots small-first. Retained balances stay usable.
# auto_fund=false pauses new funding, not eligible automatic retirement.
# First positive USDC credit consumes the initial claim, even below target; accepted source work stays owned.
# TEMPLATE ONLY. Copy to live-tor-providers.local.toml and follow tests/live/INTEGRATION.md.
# No funding starts by default. Failed catalogs are recorded in coverage.json.
version = 1
[network]
mode = "tor"
socks_endpoint = "127.0.0.1:9150"
isolation_namespace = "qualification_replace_me"
socks_auth = "tor_extended"
connect_timeout_seconds = 120
read_timeout_seconds = 60
[treasury]
id = "11111111-1111-4111-8111-111111111111"
state_dir = "../../../state/qualification-template"
key_file = "../../../secrets/qualification-template.key"
indexer_url_env = "ZCASH_INDEXER_URL"
submission_url_env = "ZCASH_SUBMISSION_URL"
max_refund_shielding_fee_zec = "0.0003"
confirmations = 3
[funding]
auto_fund = false
confidentiality = "public"
base_rpc_url_env = "BASE_RPC_URL"
# Reviewed Tor test endpoint: export BASE_RPC_URL=https://base-rpc.publicnode.com
# Verification remains required; omitted fallback settings retain dRPC/Base failover.
base_confirmations = 12
[wallets.coverage_a]
mode = "zcash_rotation"
max_retirement_remainder_usdc = "0" # exact-zero override; retire only eligible empty retained wallets
# Review the current bridge minimum before authorizing new funding.
# It is not a universal or permanent route minimum.
max_api_payment_usdc = "0.20"
max_funding_spend_zec = "0.002"
max_conversion_overhead_percent = 5

[wallets.coverage_a.reserves.small]
funding_amount_usdc = "2.00"

[wallets.coverage_b]
mode = "zcash_rotation"
max_retirement_remainder_usdc = "0" # exact-zero override; retire only eligible empty retained wallets
max_api_payment_usdc = "0.20"
max_funding_spend_zec = "0.002"
max_conversion_overhead_percent = 5

[wallets.coverage_b.reserves.small]
funding_amount_usdc = "2.00"

