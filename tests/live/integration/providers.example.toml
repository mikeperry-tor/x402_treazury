# Reviewed 23-provider baseline: 22 paid calls, one unsigned directory call.
# Help fetch/hit cases are unsigned. See PROVIDER_PRESETS.md for evidence and limits.
# Copy and review deployment/state references; no new funding is permitted.
# Zero window and placeholder UUID deliberately prevent execution.
version = 1
run_id = "replace_with_unique_run_id"
treasury_id = "replace_with_treasury_uuid"
deployment = "../../../examples/live-tor-providers.toml"
binary = "../../../target/debug/x402_treazury"
evidence_dir = "../../../target/live-integration/replace_with_unique_run_id"
registry_authorization = "replace_with_authorization_id"
[start]
mode = "funded_pools"
pools = ["coverage_b"]
[network]
tor_mode = "owned"
tor_binary = "/replace/with/installed/tor"
confinement = "macos_sandbox"
require_isolation_evidence = true
[limits]
api_reservation_usdc = "4.40"
new_funding_jobs = 0
source_exposure_zec = "0"
max_in_flight = 2
run_seconds = 14400
phase_seconds = 1800
call_seconds = 300
cleanup_seconds = 900
result_bytes = 16777216
[catalog]
execution = "frozen"
record_live_discovery = true
[[windows]]
id = "main"
not_before = 0
not_after = 0

# Each reservation must cover the configured wallet cap, not merely the quoted fee.


