# Reserve sizes are funding preferences; the explicit group cap governs every wallet.
# Initial funding fills enabled slots small-first; these templates enable only the small slot. Refill vacant slots small-first. Retained balances stay usable.
# auto_fund=false pauses new funding, not eligible automatic retirement.
# First positive USDC credit consumes the initial claim, even below its nominal minimum; accepted source work stays owned.
# Copy with the matching manifest to a private directory, make paths absolute,
# and supply the initialized treasury UUID/state/key and owned Tor endpoint.
version = 1
[network]
mode = "tor"
socks_endpoint = "127.0.0.1:19450"
isolation_namespace = "integration_replace_me"
socks_auth = "tor_extended"
[treasury]
id = "11111111-1111-4111-8111-111111111111"
state_dir = "../../../state/replace_me"
key_file = "../../../secrets/replace_me.key"
indexer_url_env = "ZCASH_INDEXER_URL"
submission_url_env = "ZCASH_SUBMISSION_URL"
confirmations = 3
[funding]
# Enable only for reviewed rotation/lifecycle/bootstrap manifests, alongside
# --allow-funding and positive registry limits. Zero-funding runs enforce denial.
auto_fund = false
confidentiality = "public"
base_confirmations = 12
[wallets.test_pool]
mode = "zcash_rotation"
max_retirement_remainder_usdc = "0" # exact-zero override; retire only eligible empty retained wallets
max_api_payment_usdc = "0.20"

[wallets.test_pool.reserves.small]
# Default randomized nominal funding: $2-5.

[wallets.independent_pool]
mode = "zcash_rotation"
max_retirement_remainder_usdc = "0" # exact-zero override; retire only eligible empty retained wallets
max_api_payment_usdc = "0.20"

[wallets.independent_pool.reserves.small]
# Default randomized nominal funding: $2-5.

[sources.depletion]
extends = "../../../providers/arkham.toml"
prefix = "depletion"
overrides = {}
wallet = "test_pool"
[sources.shared]
extends = "../../../providers/socialfetch.toml"
prefix = "shared"
overrides = {}
wallet = "test_pool"
[sources.independent]
extends = "../../../providers/socialfetch.toml"
prefix = "independent"
overrides = {}
wallet = "independent_pool"
[servers.a]
listen = "127.0.0.1:18481"
bearer_token_env = "INTEGRATION_A_TOKEN"
sources = ["depletion", "shared"]
include_tools = ["depletion_balances_address", "shared_twitter_profiles_handle"]
[servers.b]
listen = "127.0.0.1:18482"
bearer_token_env = "INTEGRATION_B_TOKEN"
sources = ["shared"]
include_tools = ["shared_twitter_profiles_handle"]
[servers.c]
listen = "127.0.0.1:18483"
bearer_token_env = "INTEGRATION_C_TOKEN"
sources = ["independent"]
include_tools = ["independent_twitter_profiles_handle"]
