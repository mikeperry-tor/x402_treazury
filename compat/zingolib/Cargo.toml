# Combined build/test experiment; not part of the runnable prototype.
[package]
name = "x402-zingolib-compat"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]

# This independent workspace does not inherit the application's profiles.
[profile.dev]
debug = "line-tables-only"

[dependencies]
x402_treazury = { path = "../.." }
zingolib = { git = "https://github.com/zingolabs/zingolib", rev = "bfb0a2156819ea7f75a9b09b1724abfd06c8925e", default-features = false }

# Reviewed transport patches: see vendor/README.md.
[patch.crates-io]
reqwest = { path = "../../vendor/reqwest" }
h2 = { path = "../../vendor/h2" }
hyper = { path = "../../vendor/hyper" }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
alloy-primitives = "1.5"
alloy-sol-types = "1.5"
axum = "0.8"
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query"] }
rmcp = { version = "=3.5.0", default-features = false, features = ["server"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
zip32 = "0.3.0"

[[test]]
name = "payments"
path = "../../tests/payments.rs"
[[test]]
name = "server"
path = "../../tests/server.rs"
[[test]]
name = "crypto_vectors"
path = "../../tests/crypto_vectors.rs"

[patch."https://github.com/zingolabs/zingolib"]
pepper-sync = { path = "../../vendor/pepper-sync" }
