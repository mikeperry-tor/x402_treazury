# Combined build/test experiment; not part of the runnable prototype.
[package]
name = "x402-zingolib-compat"
version = "0.0.0"
edition = "2024"
publish = false
[workspace]

# This independent workspace does not inherit the application's profiles.
[profile.dev]
debug = "line-tables-only"

[dependencies]
x402_treazury = { path = "../..", default-features = false }
zingolib = { path = "../../vendor/zingolib", default-features = false }

# Experimental compatibility patch: see vendor/README.md.
[patch.crates-io]
# Required by zingolib v6.0.0's own workspace. Cargo does not inherit
# dependency workspaces' root patches into this workspace.
lightwallet-protocol = { git = "https://github.com/zingolabs/lightwallet-protocol-rust", rev = "9bdfdc77eb283f2a3d26c27100cc2ac90148cd93" }
alloy-primitives = { path = "../../vendor/alloy-primitives" }
alloy-sol-macro-expander = { path = "../../vendor/alloy-sol-macro-expander" }

[dev-dependencies]
alloy-primitives = "1.5"
alloy-sol-types = "1.5"
axum = "0.8"
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query"] }
rmcp = { version = "=3.5.0", default-features = false, features = ["server"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
zip32 = "0.2.1"

[[test]]
name = "payments"
path = "../../tests/payments.rs"
[[test]]
name = "server"
path = "../../tests/server.rs"
[[test]]
name = "crypto_vectors"
path = "../../tests/crypto_vectors.rs"

[patch."https://github.com/zingolabs/zingolib"]
zingolib = { path = "../../vendor/zingolib" }
zingo-netutils = { path = "../../vendor/zingo-netutils" }
