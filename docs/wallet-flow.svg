<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 720" role="img" aria-labelledby="title description">
  <title id="title">Wallet funding and payment flow</title>
  <desc id="description">Shielded Zcash funds small and optional large wallets through NEAR Intents. A first payment makes either wallet active. A dashed arrow labeled Below a call's cost points right from the active wallet to a stack of low balance wallets. The active wallet serves higher-cost API calls, and low balance wallets serve matching low-cost API calls. Both connect through wallet-isolated Tor circuits to the API provider group.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <mask id="active-call-label-gap" maskUnits="userSpaceOnUse" x="460" y="440" width="20" height="100">
      <rect x="460" y="440" width="20" height="100" fill="white"/>
      <rect x="460" y="478" width="20" height="24" fill="black"/>
    </mask>
  </defs>
  <style>
    .card { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; }
    .edge { fill: none; stroke: #64748b; stroke-width: 1.5; marker-end: url(#arrow); }
    text { fill: #1f2937; font: 16px system-ui, sans-serif; text-anchor: middle; dominant-baseline: middle; }
    .caption { font-size: 14px; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #1e293b; stroke: #94a3b8; }
      .edge { stroke: #94a3b8; }
      text { fill: #f1f5f9; }
    }
  </style>

  <!-- Funding and promotion. -->
  <path class="edge" d="M 450 80 V 130"/>
  <path class="edge" d="M 400 190 L 230 240"/>
  <path class="edge" d="M 500 190 L 665 240"/>
  <path class="edge" d="M 230 300 C 230 350 405 330 420 390"/>
  <path class="edge" d="M 665 300 C 665 350 515 330 505 390"/>
  <text class="caption" x="470" y="355">first payment</text>

  <!-- The active wallet and retained stack share one horizontal row. -->
  <path class="edge" d="M 575 420 H 750" stroke-dasharray="6 5"/>
  <text class="caption" x="662" y="400">Below a call's cost</text>
  <path class="edge" d="M 470 450 V 530" mask="url(#active-call-label-gap)"/>
  <text class="caption" x="470" y="490">Higher-cost API calls</text>
  <path class="edge" d="M 865 450 V 510 Q 865 560 815 560 H 600"/>
  <text class="caption" x="725" y="585">Matching low-cost API calls</text>
  <path class="edge" d="M 470 590 V 640"/>

  <rect class="card" x="320" y="20" width="260" height="60" rx="4"/>
  <text x="450" y="50">Shielded Zcash treasury</text>
  <rect class="card" x="350" y="130" width="200" height="60" rx="4"/>
  <text x="450" y="160">NEAR Intents swaps</text>
  <rect class="card" x="130" y="240" width="200" height="60" rx="4"/>
  <text x="230" y="270">Small wallet</text>
  <rect class="card" x="550" y="240" width="230" height="60" rx="4"/>
  <text x="665" y="270">Optional Large Wallet</text>

  <rect class="card" x="762" y="378" width="230" height="60" rx="4"/>
  <rect class="card" x="756" y="384" width="230" height="60" rx="4"/>
  <rect class="card" x="750" y="390" width="230" height="60" rx="4"/>
  <text x="865" y="420">Low Balance Wallets</text>
  <rect class="card" x="365" y="390" width="210" height="60" rx="4"/>
  <text x="470" y="420">Active USDC Wallet</text>

  <rect class="card" x="340" y="530" width="260" height="60" rx="4"/>
  <text x="470" y="560">Wallet-Isolated Tor Circuit</text>
  <rect class="card" x="355" y="640" width="230" height="60" rx="4"/>
  <text x="470" y="670">API Provider group</text>
</svg>
